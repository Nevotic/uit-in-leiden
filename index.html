<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uit in Leiden</title>
<meta name="description" content="What's on in and around Leiden, plus date ideas that check the weather.">
<meta name="theme-color" content="#f7f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09080d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cg fill='none' stroke='%23b5121b' stroke-width='4' stroke-linecap='round'%3E%3Cg transform='rotate(45 24 24)'%3E%3Ccircle cx='24' cy='9' r='5'/%3E%3Cpath d='M24 14v28M24 34h6M24 39h5'/%3E%3C/g%3E%3Cg transform='rotate(-45 24 24)'%3E%3Ccircle cx='24' cy='9' r='5'/%3E%3Cpath d='M24 14v28M24 34h-6M24 39h-5'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: bento home over a slow-drifting gradient glow; frosted header with a sliding nav pill;
   swipeable rows of gradient-cover event cards; agenda views as card grids grouped by day. */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{
  --bg:#f7f4f6; --fg:#17141b; --muted:#6c6873; --line:rgba(23,20,27,.08); --line-strong:rgba(23,20,27,.15);
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,255,255,.8); --glass-edge:rgba(255,255,255,.8);
  --card:rgba(255,255,255,.9); --fill:rgba(23,20,27,.06); --fill-hover:rgba(23,20,27,.1); --thumb:#fff; --badge:rgba(255,255,255,.92); --badge-fg:#17141b;
  --red:#d0142c; --red-soft:rgba(208,20,44,.1); --canal:#1f8a99; --amber:#a86400; --amber-soft:rgba(245,158,11,.16);
  --g1:#ff4d5e; --g2:#ff9966; --g3:#2bb6c4; --g4:#8b5cf6; --glow-o:.5;
  --shadow:0 1px 2px rgba(30,10,30,.04),0 10px 28px -12px rgba(60,10,50,.18);
  --shadow-hi:0 2px 4px rgba(30,10,30,.05),0 28px 56px -20px rgba(80,10,60,.32);
  --toast:rgba(23,20,27,.88); --toast-fg:#fff;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --settle:cubic-bezier(.2,.9,.25,1); --spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09080d; --fg:#f5f2f8; --muted:#a39fae; --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --glass:rgba(28,25,36,.5); --glass-strong:rgba(32,29,42,.72); --glass-edge:rgba(255,255,255,.09);
  --card:rgba(24,21,31,.86); --fill:rgba(255,255,255,.07); --fill-hover:rgba(255,255,255,.12); --thumb:rgba(255,255,255,.2); --badge:rgba(16,14,22,.82); --badge-fg:#fff;
  --red:#ff5d6c; --red-soft:rgba(255,93,108,.16); --canal:#62d3df; --amber:#f6b54a; --amber-soft:rgba(246,181,74,.15);
  --glow-o:.42; --shadow:0 0 0 .5px rgba(255,255,255,.05),0 14px 32px -14px rgba(0,0,0,.7); --shadow-hi:0 0 0 .5px rgba(255,255,255,.08),0 30px 60px -20px rgba(0,0,0,.8);
  --toast:rgba(46,42,56,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09080d; --fg:#f5f2f8; --muted:#a39fae; --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --glass:rgba(28,25,36,.5); --glass-strong:rgba(32,29,42,.72); --glass-edge:rgba(255,255,255,.09);
  --card:rgba(24,21,31,.86); --fill:rgba(255,255,255,.07); --fill-hover:rgba(255,255,255,.12); --thumb:rgba(255,255,255,.2); --badge:rgba(16,14,22,.82); --badge-fg:#fff;
  --red:#ff5d6c; --red-soft:rgba(255,93,108,.16); --canal:#62d3df; --amber:#f6b54a; --amber-soft:rgba(246,181,74,.15);
  --glow-o:.42; --shadow:0 0 0 .5px rgba(255,255,255,.05),0 14px 32px -14px rgba(0,0,0,.7); --shadow-hi:0 0 0 .5px rgba(255,255,255,.08),0 30px 60px -20px rgba(0,0,0,.8);
  --toast:rgba(46,42,56,.88); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 .9375rem/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
a{color:inherit}
svg{display:block}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:is(a,button,input,.seg-opt):focus-visible{outline:2px solid var(--g4);outline-offset:3px;border-radius:.75rem}

/* ---- Ambient glow: soft colour fields drifting behind everything ---- */
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.glow i{position:absolute;border-radius:50%;opacity:var(--glow-o);filter:blur(48px);will-change:transform}
.glow .b1{width:62vmax;height:62vmax;left:-22vmax;top:-30vmax;background:radial-gradient(circle,var(--g1) 0,transparent 62%);animation:d1 26s ease-in-out infinite alternate}
.glow .b2{width:54vmax;height:54vmax;right:-22vmax;top:-20vmax;background:radial-gradient(circle,var(--g4) 0,transparent 62%);animation:d2 32s ease-in-out infinite alternate}
.glow .b3{width:70vmax;height:70vmax;left:5vmax;bottom:-46vmax;background:radial-gradient(circle,var(--g3) 0,transparent 62%);animation:d3 38s ease-in-out infinite alternate}
.glow .b4{width:50vmax;height:50vmax;right:-16vmax;bottom:-30vmax;background:radial-gradient(circle,var(--g2) 0,transparent 62%);animation:d4 29s ease-in-out infinite alternate}
@keyframes d1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(14vmax,10vmax) scale(1.18)}100%{transform:translate(4vmax,22vmax) scale(.92)}}
@keyframes d2{0%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-16vmax,14vmax) scale(.9)}100%{transform:translate(-6vmax,4vmax) scale(1.2)}}
@keyframes d3{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18vmax,-12vmax) scale(1.12)}100%{transform:translate(-10vmax,-4vmax) scale(.95)}}
@keyframes d4{0%{transform:translate(0,0) scale(.95)}50%{transform:translate(-12vmax,-16vmax) scale(1.15)}100%{transform:translate(6vmax,-6vmax) scale(1)}}

/* ---- Header ---- */
.top{position:sticky;top:0;z-index:30;padding:.75rem 0 .625rem}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border-bottom:.5px solid var(--line);opacity:0;transition:opacity .35s ease}
.top.scrolled::before{opacity:1}
.topin{max-width:70rem;margin:0 auto;padding:0 1rem;display:flex;align-items:center;gap:1rem}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.1875rem;letter-spacing:-.025em;flex:none}
.brand svg{width:1.875rem;height:1.875rem;transition:transform .7s var(--spring)}
@media (hover:hover){.brand:hover svg{transform:rotate(-18deg) scale(1.08)}}
.search{position:relative;flex:1;max-width:22rem;margin-left:auto}
.search input{width:100%;height:2.5rem;font-size:.9375rem;border-radius:999px;padding:0 1rem 0 2.5rem;outline:none;background:var(--glass-strong);border:.5px solid var(--glass-edge);
  box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:box-shadow .3s ease,background-color .3s ease}
.search input::placeholder{color:var(--muted)}
.search input:focus{box-shadow:var(--shadow),0 0 0 4px color-mix(in srgb,var(--g4) 22%,transparent)}
.search svg{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;color:var(--muted);pointer-events:none;z-index:1}
.nav{position:relative;display:flex;width:max-content;max-width:calc(100% - 2rem);margin:.75rem auto 0;padding:.25rem;border-radius:999px;background:var(--glass-strong);
  border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.navpill{position:absolute;top:.25rem;bottom:.25rem;left:.25rem;width:0;border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px -6px rgba(0,0,0,.2);
  transition:transform .5s var(--settle),width .5s var(--settle),background .4s ease,opacity .2s}
.nav[data-k="plan"] .navpill{background:linear-gradient(120deg,var(--g1),var(--g2))}
.navbtns{position:relative;z-index:1;display:flex;gap:.125rem}
.navbtn{border:0;background:none;padding:.5rem 1rem;border-radius:999px;font-weight:600;font-size:.875rem;letter-spacing:-.005em;color:var(--muted);display:inline-flex;gap:.375rem;align-items:center;white-space:nowrap;cursor:pointer;transition:color .3s ease,transform .12s ease-out}
.navbtn:active{transform:scale(.95)}
.navbtn[aria-selected="true"]{color:var(--fg)}
.navbtn.plan .nheart{color:var(--g1);width:.95rem;height:.95rem;display:inline-grid}
.nav[data-k="plan"] .navbtn.plan{color:#fff}
.nav[data-k="plan"] .navbtn.plan .nheart{color:#fff}
.count{font:600 .6875rem var(--mono);font-variant-numeric:tabular-nums;background:var(--fill);color:var(--muted);border-radius:999px;padding:.05rem .4rem;margin-left:.125rem}

.wrap{max-width:70rem;margin:0 auto;padding:1rem 1rem 3rem}

/* ---- Motion: entrances, scroll reveals ---- */
.motion #out.in .rv{animation:rise .75s var(--settle) both;animation-delay:calc(var(--d,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.motion .sr{transition:opacity .9s var(--settle),transform .9s var(--settle)}
.motion .sr:not(.seen){opacity:0;transform:translateY(32px)}
.motion .idea.re{animation:rise .6s var(--settle) both}
@keyframes shimmer{to{background-position:-300% 0}}
@keyframes floaty{from{transform:translateY(0) rotate(0)}to{transform:translateY(-6px) rotate(4deg)}}
@keyframes beat{0%,60%,100%{transform:scale(1)}10%{transform:scale(1.2)}20%{transform:scale(1)}30%{transform:scale(1.12)}}
@keyframes spin{to{--ang:360deg}}
@keyframes pop{0%{transform:scale(.7)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

/* Tilt + glare on hover (pointer devices only; values set from JS) */
[data-tilt]{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px)) scale(var(--press,1));
  transition:transform .7s var(--settle),box-shadow .45s ease}
[data-tilt].tilting{--lift:-5px;box-shadow:var(--shadow-hi);transition:transform .14s ease-out,box-shadow .3s ease}
[data-tilt]:active{--press:.985}
[data-tilt]::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s ease;z-index:3;
  background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.32),transparent 50%);mix-blend-mode:soft-light}
[data-tilt].tilting::after{opacity:1}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;gap:.4rem;border:0;cursor:pointer;text-decoration:none;font-weight:600;font-size:.875rem;letter-spacing:-.005em;
  background:var(--fill);border-radius:999px;padding:.55rem 1rem;min-height:2.375rem;transition:background-color .2s ease,transform .12s ease-out,color .2s}
.btn svg{width:1rem;height:1rem}
@media (hover:hover){.btn:hover{background:var(--fill-hover)}}
.btn:active{transform:scale(.96)}
.btn[aria-pressed="true"]{background:var(--red-soft);color:var(--red)}
.btn-glow{position:relative;display:inline-flex;align-items:center;gap:.5rem;border:0;cursor:pointer;text-decoration:none;color:#fff;font-weight:700;font-size:.9375rem;letter-spacing:-.01em;
  padding:.7rem 1.25rem;min-height:2.75rem;border-radius:999px;background:linear-gradient(120deg,var(--g1),var(--g2) 55%,var(--g1));background-size:200% 100%;
  box-shadow:0 8px 24px -8px color-mix(in srgb,var(--g1) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .14s ease-out,box-shadow .3s ease,background-position .6s var(--settle)}
.btn-glow svg{width:1.05rem;height:1.05rem}
@media (hover:hover){.btn-glow:hover{background-position:100% 0;box-shadow:0 12px 32px -8px color-mix(in srgb,var(--g1) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}}
.btn-glow:active{transform:scale(.96)}
.motion .btn-glow svg{animation:beat 2.4s ease-in-out infinite}

/* ---- Bento ---- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(10rem,auto);gap:1rem;margin-top:.5rem;
  grid-template-areas:"hello hello wx hl" "hello hello ton cls" "plan plan plan sav"}
.tile{position:relative;display:flex;flex-direction:column;gap:.25rem;padding:1.125rem 1.25rem;border-radius:1.625rem;overflow:hidden;text-decoration:none;color:inherit;
  background:var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%)}
.lbl{font-weight:700;font-size:.6875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:2.75rem;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:auto}
.tsub{font-size:.8125rem;color:var(--muted);line-height:1.35}
.t-hello{grid-area:hello;padding:2rem 2rem 1.75rem;justify-content:flex-end;gap:0;min-height:21rem}
.t-hello::before{content:"";position:absolute;width:24rem;height:24rem;right:-8rem;top:-10rem;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--g1) 40%,transparent),transparent 65%);pointer-events:none}
.hellokeys{position:absolute;right:1.5rem;top:1.5rem;width:4.5rem;height:4.5rem;opacity:.9}
.motion .hellokeys{animation:floaty 5s ease-in-out infinite alternate}
.hellosub{font-weight:600;color:var(--muted);font-size:.9375rem}
.hello{font-family:var(--display);font-weight:800;font-size:clamp(2.125rem,4.8vw,3.625rem);line-height:1.02;letter-spacing:-.04em;margin:.5rem 0 0;text-wrap:balance;max-width:14ch}
.grad{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g4),var(--g3),var(--g1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.motion .grad{animation:shimmer 12s linear infinite}
.hellodate{color:var(--muted);margin:.75rem 0 0;font-size:.9375rem}
.hellobtns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem}
.t-wx{grid-area:wx}
.wxnow{display:flex;align-items:center;gap:.5rem;margin-top:auto}
.wxbig{font-family:var(--display);font-weight:800;font-size:2.75rem;line-height:1;letter-spacing:-.04em}
.wxico{font-size:2.25rem;line-height:1}
.motion .wxico{animation:floaty 3.5s ease-in-out infinite alternate}
.wxdesc{margin:0;font-size:.8125rem;color:var(--muted)}
.wxnext{list-style:none;margin:.5rem 0 0;padding:.5rem 0 0;border-top:.5px solid var(--line-strong);display:flex;justify-content:space-between;font-size:.75rem}
.wxnext li{display:flex;flex-direction:column;align-items:center;gap:.05rem}
.wxnext span{color:var(--muted);font-weight:600}
.wxnext b{font-weight:600}
.wxload{margin-top:auto;color:var(--muted);font-size:.875rem}
.t-wx.fresh .wxnow,.t-wx.fresh .wxdesc,.t-wx.fresh .wxnext{animation:rise .6s var(--settle) both}
.t-hl{grid-area:hl;color:#fff;border-color:rgba(255,255,255,.2);background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--cc) 40%,#fff) 0,transparent 55%),linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 45%,#120818))}
.t-hl .lbl{color:rgba(255,255,255,.8)}
.hlglyph{position:absolute;right:-.5rem;bottom:-1.25rem;font-size:5.5rem;line-height:1;transform:rotate(-12deg);filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}
.motion .hlglyph{animation:floaty 4.5s ease-in-out infinite alternate}
.hltitle{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1;letter-spacing:-.025em;margin-top:auto;max-width:12ch;position:relative;z-index:1;text-wrap:balance;text-shadow:0 1px 10px rgba(0,0,0,.2)}
.hlsub{font-size:.8125rem;opacity:.9;position:relative;z-index:1;max-width:calc(100% - 3.5rem);text-shadow:0 1px 8px rgba(0,0,0,.25)}
.t-ton{grid-area:ton}
.mini{list-style:none;margin:.375rem 0 0;padding:0;font-size:.8125rem;line-height:1.3}
.mini li{display:flex;gap:.4rem;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini i{flex:none;width:.45rem;height:.45rem;border-radius:50%;background:var(--cc);transform:translateY(-.05rem)}
.t-cls{grid-area:cls}
.ringrow{position:relative;width:3.5rem;height:3.5rem;margin:.25rem 0 auto}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring-bg{stroke:var(--fill-hover)}
.ring-fg{stroke:url(#ringgrad);stroke-dasharray:var(--c);stroke-dashoffset:var(--off)}
.motion #out.in .ring-fg{animation:ring 1.4s var(--settle) .35s both}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.ringnum{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ringnum b{font-family:var(--display);font-weight:800;font-size:1.125rem;letter-spacing:-.03em}
.ringnum span{font-size:.5625rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.clsname{font-family:var(--display);font-weight:700;font-size:.9375rem;line-height:1.2;letter-spacing:-.015em;margin-top:.5rem}
.t-plan{grid-area:plan;flex-direction:row;align-items:center;gap:1.125rem;padding:1.25rem 1.5rem;min-height:7.5rem}
.t-plan::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),var(--g1),var(--g2),var(--g3),var(--g4),var(--g1));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.motion .t-plan::before{animation:spin 6s linear infinite}
.planglow{position:absolute;inset:-40%;background:conic-gradient(from var(--ang),transparent,color-mix(in srgb,var(--g1) 22%,transparent),transparent 30%,color-mix(in srgb,var(--g4) 22%,transparent),transparent 60%);filter:blur(30px);pointer-events:none}
.motion .planglow{animation:spin 10s linear infinite}
.heart{flex:none;width:3.5rem;height:3.5rem;border-radius:1.125rem;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 24px -8px color-mix(in srgb,var(--g1) 70%,transparent);position:relative}
.heart svg{width:1.6rem;height:1.6rem}
.motion .heart svg{animation:beat 2.4s ease-in-out infinite}
.plantitle{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;line-height:1.1}
.t-plan .tsub{font-size:.875rem;position:relative}
.t-plan>div{position:relative;flex:1}
.go{flex:none;width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;background:var(--fill);position:relative;transition:transform .5s var(--spring),background-color .3s}
.go svg{width:1.125rem;height:1.125rem}
@media (hover:hover){.t-plan:hover .go{transform:translateX(4px);background:var(--fg);color:var(--bg)}}
.t-plan:active{transform:scale(.99)}
.t-plan{transition:transform .14s ease-out}
.t-sav{grid-area:sav}

/* ---- Section rows ---- */
.sec{margin-top:2.75rem}
.sechd{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.sechd h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,2.8vw,1.875rem);line-height:1.05;letter-spacing:-.035em;margin:0}
.sechd p{margin:.3rem 0 0;color:var(--muted);font-size:.875rem}
.sechd-r{display:flex;gap:.375rem;align-items:center;flex:none}
.arrow{width:2.375rem;height:2.375rem;border-radius:50%;border:.5px solid var(--glass-edge);background:var(--glass-strong);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;transition:transform .12s ease-out,background-color .2s}
.arrow svg{width:1rem;height:1rem}
.arrow:active{transform:scale(.92)}

/* ---------- dates ---------- */
const DAY = 864e5;
const DOW = ["ZO","MA","DI","WO","DO","VR","ZA"], MON=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const add = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const today = new Date(); today.setHours(0,0,0,0);
const TODAY = iso(today);
const daysBetween = (a,b) => Math.round((pd(b)-pd(a))/DAY);
const nice = s => { const d=pd(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const shortNice = s => { const d=pd(s); return `${DAYS[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };

// Time windows relative to today, so the page stays right after it's uploaded.
const dow = today.getDay();
let wkStart, wkEnd;
if (dow===6 || dow===0 || dow===5) { wkStart = today; wkEnd = add(today, (7-dow)%7); }
else { wkStart = add(today, 6-dow); wkEnd = add(wkStart, 1); }
let wnStart = (dow>=1 && dow<=4) ? today : add(today, ((8-dow)%7)||7);
const wnEnd = add(wnStart, 4-wnStart.getDay());
const W = {
  weekend:[iso(wkStart), iso(wkEnd)],
  next:[iso(wnStart), iso(wnEnd)],
  soon:[iso(add(wkEnd > wnEnd ? wkEnd : wnEnd, 1)), iso(add(today, 60))],
};

const isEvergreen = x => !x.s && !x.e;
const isExpo = x => x.cat==="Exhibition";
function occurs(x, day){ // does event x happen on YYYY-MM-DD day?
  if (isEvergreen(x)) return true;
  if (x.dates) return x.dates.includes(day);
  if (x.weekly!==undefined) return day>=x.s && pd(day).getDay()===x.weekly;
  return (!x.s || x.s<=day) && (!x.e || day<=x.e);
}
function datesIn(x, [a,b]){ const out=[]; for (let d=pd(a); iso(d)<=b; d=add(d,1)) if (occurs(x, iso(d))) out.push(iso(d)); return out; }
const ended = x => x.e && x.e < TODAY && x.weekly===undefined;
// A continuous run (festival, multi-day event), as opposed to one day or scattered dates.
const isRun = x => x.weekly===undefined && !x.dates && x.s && x.e && x.s!==x.e;
const nextDate = x => x.dates ? (x.dates.find(d=>d>=TODAY) || x.dates.at(-1)) : x.weekly!==undefined ? (datesIn(x,[TODAY,iso(add(today,7))])[0] || x.s) : x.s;
const HL = () => E.find(x=>x.hl && !ended(x));

  const r = (a,b) => a===b ? nice(a) : `${nice(a)} to ${nice(b)}`;
  return {
    weekend: r(...W.weekend) + "." + (HL() && datesIn(HL(), W.weekend).length ? ` ${HL().t} is the big one this week.` : ""),
    next: r(...W.next) + ". Good for a midweek concert or comedy night after work.",
    soon: "The next two months, in Leiden and nearby.",
    expo: "Sorted by closing date, so the ones about to close come first.",
    always: "No date needed. For when nothing on the agenda clicks.",
    plan: "Pick a day and a mood. You get three plans built from what's on that day, checked against the forecast.",
  }[k];
}

let tab = "home", cat = "All", query = "", lastSection = "weekend";
try { const h = location.hash.slice(1); if (VIEWS.includes(h)) tab = h; } catch(_){}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const motionOK = matchMedia("(prefers-reduced-motion: no-preference)").matches;
if (motionOK) document.documentElement.classList.add("motion");

function itemsFor(k){
  const live = E.filter(x=>!ended(x));
  let list;
  if (k==="saved") list = live.filter(x=>saved.has(x.id));
  else if (k==="expo") list = live.filter(isExpo).sort((a,b)=>a.e.localeCompare(b.e));
  else if (k==="always") list = live.filter(isEvergreen);
  else if (k==="soon") list = live.filter(x=>!isExpo(x) && !isEvergreen(x) && x.weekly===undefined && datesIn(x,W.soon).length && !datesIn(x,W.weekend).length && !datesIn(x,W.next).length)
                        .sort((a,b)=>datesIn(a,W.soon)[0].localeCompare(datesIn(b,W.soon)[0]));
  else if (W[k]) list = live.filter(x=>!isExpo(x) && !isEvergreen(x) && datesIn(x,W[k]).length)
                        .sort((a,b)=>(isRun(a) ? "0" : datesIn(a,W[k])[0]).localeCompare(isRun(b) ? "0" : datesIn(b,W[k])[0]));
  else list = [];
  return list;
}

function searchItems(q){
  const f = fold(q);
  return E.filter(x=>!ended(x) && fold([x.t,x.d,x.where,x.town,x.cat].join(" ")).includes(f))
          .sort((a,b)=>(isEvergreen(a)?"9":(a.s||a.e)).localeCompare(isEvergreen(b)?"9":(b.s||b.e)));
}

/* Nav with a sliding pill */
const navKey = () => query ? "" : SECTIONS.some(s=>s.k===tab) ? "agenda" : tab;
function renderNav(){
  const nk = navKey(), n = itemsFor("saved").length + ideas.length;

function movePill(){
  const pill = $("navpill"), sel = $("navbtns").querySelector('[aria-selected="true"]');
  $("tabs").dataset.k = sel ? sel.dataset.go : "";
  if (!sel) { pill.style.opacity = 0; return; }
  pill.style.opacity = 1; pill.style.width = sel.offsetWidth+"px"; pill.style.transform = `translateX(${sel.offsetLeft}px)`;
}

/* Event card */
function dateBits(x, on){
  const f = d => [DOW[d.getDay()], String(d.getDate()), MON[d.getMonth()]];
  if (isEvergreen(x)) return ["any","day",""];
  if (on) return f(pd(on));
  if (!x.s || (isExpo(x) && x.s!==x.e)) { const [,n,m] = f(pd(x.e)); return ["until",n,m]; }
  if (x.dates || x.weekly!==undefined) return f(pd(nextDate(x)));
  if (x.s!==x.e) { const s=pd(x.s), e=pd(x.e); return ["from", `${s.getDate()}–${e.getDate()}`, s.getMonth()===e.getMonth() ? MON[e.getMonth()] : `${MON[s.getMonth()]}–${MON[e.getMonth()]}`]; }
  return f(pd(x.s));
}
function card(x, on, d = 0){
  const [cc, glyph] = CAT_STYLE[x.cat];
  const [top, big, bot] = dateBits(x, on);
  const flags = [];
  if (isExpo(x)) { const dl = daysBetween(TODAY, x.e); if (dl<=21) flags.push(`<span class="flag">${dl===0?"Last day":dl+" days left"}</span>`); }
  if (x.isNew) flags.push(`<span class="flag new">New</span>`);
  if (x.hl) flags.push(`<span class="flag new">Highlight</span>`);
  const more = x.dates ? x.dates.filter(d=>d>=TODAY && d!==(on||nextDate(x))).length : 0;
  const when = [x.time, x.weekly!==undefined ? "every "+DAYS[x.weekly] : "", more ? `+${more} more date${more===1?"":"s"}` : ""].filter(Boolean).join(" · ");
  const place = x.where + (x.town!=="Leiden" && !x.where.includes(x.town) ? ", "+x.town : "");
  const isS = saved.has(x.id);
  return `<article class="card rv" style="--cc:${cc};--d:${d}" data-tilt>
    <div class="cover"><span class="glyph" aria-hidden="true">${glyph}</span>
      <div class="dbadge"><span>${top}</span><b>${big}</b><span>${bot}</span></div>
      <div class="flags"><span class="catpill">${x.cat}</span>${flags.join("")}</div></div>
    <div class="cbody">
      <h3 class="ctitle"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.t)}</a></h3>
      <p class="cmeta">${esc(place)}${when?" · "+esc(when):""}</p>
      <p class="cdesc">${esc(x.d)}</p>
      <div class="cacts">
        ${isEvergreen(x) ? "" : `<button class="iconbtn" type="button" title="Add to calendar" aria-label="Add to calendar: ${esc(x.t)}" data-cal="${x.id}"${on?` data-on="${on}"`:""}>${CAL_SVG}</button>`}
        <button class="iconbtn star" type="button" aria-pressed="${isS}" aria-label="${isS?"Remove from saved":"Save"}: ${esc(x.t)}" data-id="${x.id}">${isS?STAR_ON:STAR}</button>
      </div>
    </div>
  </article>`;
}
const vhead = (title, sub, d = 0) => `<div class="vhead rv" style="--d:${d}"><h1 class="vtitle">${title}</h1>${sub?`<p class="vsub">${sub}</p>`:""}</div>`;

/* Home */
let wxFresh = false;
function wxTile(){
  const w = wxFor(TODAY);
  if (!w.known) return `<div class="tile t-wx rv" style="--d:2"><span class="lbl">Leiden today</span><div class="wxload">${wxState==="error" ? "Forecast unavailable right now." : "Loading the forecast…"}</div></div>`;
  const [ic, desc] = WXC(w.code);
  const next = [1,2,3].map(n=>iso(add(today,n))).filter(d=>WX[d]).map(d=>`<li><span>${DAYS[pd(d).getDay()].slice(0,3)}</span><i aria-hidden="true">${WXC(WX[d].code)[0]}</i><b>${Math.round(WX[d].tmax)}°</b></li>`).join("");
  return `<div class="tile t-wx rv${wxFresh?" fresh":""}" style="--d:2"><span class="lbl">Leiden today</span>
    <div class="wxnow"><span class="wxbig">${Math.round(w.tmax)}°</span><span class="wxico" aria-hidden="true">${ic}</span></div>
    <p class="wxdesc">${cap(desc)} · ${w.pp}% chance of rain</p><ul class="wxnext" aria-label="Next days">${next}</ul></div>`;
}
const rail = (k, title, sub, list, dated) => !list.length ? "" : `<section class="sec sr">
    <div class="sechd"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:""}</div>
      <div class="sechd-r"><button class="arrow" type="button" data-scroll="-1" aria-label="Scroll ${title} back">${LEFT}</button><button class="arrow" type="button" data-scroll="1" aria-label="Scroll ${title} forward">${RIGHT}</button>
      <a class="link" href="#${k}" data-go="${k}">See all <span class="count">${list.length}</span></a></div></div>
    <div class="rail">${list.slice(0,12).map(x=>card(x, dated && !isRun(x) ? datesIn(x,W[k])[0] : undefined)).join("")}</div></section>`;

function renderHome(){
  const wk = itemsFor("weekend"), nx = itemsFor("next"), soon = itemsFor("soon"), expo = itemsFor("expo"), always = itemsFor("always");
  const h = new Date().getHours(), greet = h<5 ? "Still up?" : h<12 ? "Good morning" : h<18 ? "Good afternoon" : "Good evening";
  const range = W.weekend[0]===W.weekend[1] ? nice(W.weekend[0]) : `${shortNice(W.weekend[0])} – ${shortNice(W.weekend[1])}`;
  const n = wk.length;
  const hlOn = HL() && datesIn(HL(), W.weekend).length ? HL() : null;

  const todays = E.filter(x=>!ended(x) && !isExpo(x) && !isEvergreen(x) && occurs(x,TODAY));
  const tomorrow = iso(add(today,1));
  const tSet = todays.length ? ["Today", todays, TODAY] : ["Tomorrow", E.filter(x=>!ended(x) && !isExpo(x) && !isEvergreen(x) && occurs(x,tomorrow)), tomorrow];
  const tKey = tSet[2] >= W.weekend[0] && tSet[2] <= W.weekend[1] ? "weekend" : "next";

    <section class="tile t-hello rv" style="--d:0">

      <span class="hellosub">${greet} 👋</span>

      <p class="hellodate">${range}${hlOn ? ` · ${esc(hlOn.t.split(/[:–(]/)[0].trim())} is on` : ""}</p>
      <div class="hellobtns"><a class="btn-glow" href="#plan" data-go="plan">${HEART} Plan a date</a><a class="btn" href="#weekend" data-go="weekend">See the weekend ${ARROW}</a></div>
    </section>
    ${wxTile()}`;
  if (hl) { const [cc, g] = CAT_STYLE[hl.cat]; const dl = hl.e ? daysBetween(TODAY, hl.e) : 0;
    html += `<a class="tile t-hl rv" style="--d:3;--cc:${cc}" href="${esc(hl.url)}" target="_blank" rel="noopener" data-tilt><span class="lbl">Highlight</span><span class="hlglyph" aria-hidden="true">${g}</span>
      <b class="hltitle">${esc(hl.t)}</b><span class="hlsub">${hl.s!==hl.e && hl.e ? `Until ${shortNice(hl.e)} · ${dl} day${dl===1?"":"s"} left` : shortNice(hl.s)}</span></a>`; }
  html += `<a class="tile t-ton rv" style="--d:4" href="#${tKey}" data-go="${tKey}" data-tilt><span class="lbl">${tSet[0]}</span>
      <span class="big" data-count="${tSet[1].length}">${tSet[1].length}</span><span class="tsub">thing${tSet[1].length===1?"":"s"} on</span>
      <ul class="mini">${tSet[1].slice(0,2).map(x=>`<li><i style="--cc:${CAT_STYLE[x.cat][0]}"></i>${esc(x.t)}</li>`).join("")}</ul></a>`;
  if (closing) { const dl = daysBetween(TODAY, closing.e), C = +(2*Math.PI*22).toFixed(2), frac = Math.max(.05, Math.min(dl,30)/30);
    html += `<a class="tile t-cls rv" style="--d:5" href="#expo" data-go="expo" data-tilt><span class="lbl">Closing soon</span>
      <div class="ringrow"><svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><defs><linearGradient id="ringgrad"><stop offset="0" stop-color="var(--g1)"/><stop offset="1" stop-color="var(--g2)"/></linearGradient></defs><circle class="ring-bg" cx="26" cy="26" r="22"/><circle class="ring-fg" cx="26" cy="26" r="22" style="--c:${C};--off:${(C*(1-frac)).toFixed(2)}"/></svg>
      <div class="ringnum"><b data-count="${dl}">${dl}</b><span>days</span></div></div>
      <b class="clsname">${esc(closing.t)}</b><span class="tsub">${esc(closing.where)}</span></a>`; }
  html += `<a class="tile t-plan rv" style="--d:6" href="#plan" data-go="plan"><span class="planglow" aria-hidden="true"></span><span class="heart">${HEART}</span>
      <div><b class="plantitle">Plan a date</b><span class="tsub">Three ideas for ${P.date===TODAY ? "today" : nice(P.date)}, matched to the forecast.</span></div><span class="go">${ARROW}</span></a>
    <a class="tile t-sav rv" style="--d:7" href="#saved" data-go="saved" data-tilt><span class="lbl">Saved</span><span class="big" data-count="${savedN}">${savedN}</span><span class="tsub">${savedN ? "stars and date ideas" : "Tap ☆ on anything you like"}</span></a>
  </div>`;
  html += rail("weekend", "This weekend", range, wk, true)
        + rail("next", "Weeknights", "After-work concerts, comedy and talks.", nx, true)
        + rail("expo", "Exhibitions", "The ones closing soonest first.", expo)
        + rail("soon", "Coming up", "Later this autumn, in Leiden and nearby.", soon)
        + rail("always", "Always good", "No date needed.", always);
  return html;
}

/* Agenda section */
function renderSection(){
  lastSection = tab;
  const base = itemsFor(tab);
  const present = new Set(base.map(x=>x.cat));
  const cats = ["All", ...CATS.filter(c=>present.has(c))];
  if (!cats.includes(cat)) cat = "All";
  const list = base.filter(x=>cat==="All"||x.cat===cat);
  let html = vhead(SECTIONS.find(s=>s.k===tab).l, introFor(tab));
  html += `<div class="pills rv" style="--d:1">${SECTIONS.map(s=>`<button class="pillbtn" type="button" aria-pressed="${s.k===tab}" data-go="${s.k}">${s.l}<span class="count">${itemsFor(s.k).length}</span></button>`).join("")}</div>`;
  if (cats.length>2) html += `<div class="chips rv" style="--d:2">${cats.map(c=>`<button class="chip" type="button" aria-pressed="${c===cat}" data-c="${esc(c)}">${c==="All"?"":`<i style="--cc:${CAT_STYLE[c][0]}"></i>`}${esc(c)}</button>`).join("")}</div>`;
  if (!list.length) return html + `<div class="empty rv" style="--d:3"><span class="emptyico">✦</span><b>${base.length ? "Nothing in this category" : "Nothing on the list for these dates yet"}</b></div>`;
  let d = 3;
  if (tab==="weekend" || tab==="next"){
    const groups = {};
    list.forEach(x=>{
      if (isRun(x)) (groups.multi=groups.multi||[]).push([x]);
      else datesIn(x, W[tab]).forEach(day=>(groups[day]=groups[day]||[]).push([x,day]));
    });
    const order = Object.keys(groups).sort((a,b)=> a==="multi"?-1 : b==="multi"?1 : a.localeCompare(b));
    html += order.map(k=>{
      const label = k==="multi" ? (tab==="weekend"?"Running all weekend":"Running all week") : (k===TODAY ? `<span class="todaytag">Today</span>` : "") + nice(k);
      return `<h2 class="day rv" style="--d:${Math.min(d++,14)}">${label}</h2><div class="grid">${groups[k].map(([x,day])=>card(x, day, Math.min(d++,14))).join("")}</div>`;
    }).join("");
  } else html += `<div class="grid" style="margin-top:1.5rem">${list.map(x=>card(x, undefined, Math.min(d++,14))).join("")}</div>`;
  return html;
}

function renderSaved(){
  const list = itemsFor("saved");
  let html = vhead("Saved", "Your stars and date ideas. They're kept in this browser only.");
  if (ideas.length) html += `<h2 class="day rv" style="--d:1">Date ideas</h2><div class="ideas">${ideas.map((it,i)=>ideaCard(it,{saved:true,i})).join("")}</div>`;
  if (list.length) html += `<h2 class="day rv" style="--d:2">Events and places</h2><div class="grid">${list.map((x,i)=>card(x, undefined, Math.min(i+3,14))).join("")}</div>`;
  if (!ideas.length && !list.length) html += `<div class="empty rv" style="--d:1"><span class="emptyico">✦</span><b>Nothing saved yet</b><p>Tap the star on anything that looks good, or save an idea from Plan a date.</p><a class="btn-glow" href="#plan" data-go="plan">${HEART} Plan a date</a></div>`;
  return html;
}

function renderSearch(){
  const list = searchItems(query);
  if (!list.length) return vhead("No results", `Nothing matches “${esc(query)}”. Try a venue, a town or a category.`);
  return vhead(`${list.length} result${list.length===1?"":"s"}`, `For “${esc(query)}” across everything.`)
    + `<div class="grid">${list.map((x,i)=>card(x, undefined, Math.min(i+1,14))).join("")}</div>`;
}

/* Render + entrance */
let swapT, io;
function countUp(){
  if (!motionOK) return;
  $("out").querySelectorAll("[data-count]").forEach(el=>{
    const n = +el.dataset.count; if (!n) return;
    const t0 = performance.now(), dur = 1000;
    const step = t => { const p = Math.min(1,(t-t0)/dur); el.textContent = Math.round(n*(1-Math.pow(1-p,3))); if (p<1) requestAnimationFrame(step); };
    el.textContent = "0"; requestAnimationFrame(step);
  });
}
function revealOnScroll(animate){
  const els = $("out").querySelectorAll(".sr");
  io?.disconnect();
  if (!animate || !motionOK || !("IntersectionObserver" in window)) { els.forEach(e=>e.classList.add("seen")); return; }
  io = new IntersectionObserver(es=>es.forEach(en=>{ if (en.isIntersecting){ en.target.classList.add("seen"); io.unobserve(en.target); } }), {rootMargin:"0px 0px -10% 0px"});
  els.forEach(e=>io.observe(e));
}
function render(animate = false){
  renderNav();
  let html;
  if (query) html = renderSearch();
  else if (tab==="home") html = renderHome();
  else if (tab==="plan") html = vhead("Plan a date", introFor("plan")) + renderPlanner();
  else if (tab==="saved") html = renderSaved();
  else html = renderSection();
  const o = $("out");
  o.innerHTML = html;
  if (animate) { o.classList.remove("in"); void o.offsetWidth; o.classList.add("in"); clearTimeout(swapT); swapT = setTimeout(()=>o.classList.remove("in"), 1800); countUp(); }
  revealOnScroll(animate);
  wxFresh = false;
}

/* ---------- calendar (.ics) ---------- */
const icsEsc = s => String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
const icsDate = s => s.replace(/-/g,"");
const icsDT = (s,t) => icsDate(s)+"T"+t.replace(":","")+"00";
function fold75(line){ const out=[]; while (line.length>74){ out.push(line.slice(0,74)); line=" "+line.slice(74); } out.push(line); return out.join("\r\n"); }
function downloadIcs(name, ev){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Uit in Leiden//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:${ev.uid}@uit-in-leiden`,`DTSTAMP:${stamp}`,
    ...(ev.allDay ? [`DTSTART;VALUE=DATE:${icsDate(ev.start)}`,`DTEND;VALUE=DATE:${icsDate(iso(add(pd(ev.end||ev.start),1)))}`]
                  : [`DTSTART:${icsDT(ev.start,ev.startTime)}`,`DTEND:${icsDT(ev.endDate||ev.start,ev.endTime)}`]),
    `SUMMARY:${icsEsc(ev.title)}`, ev.location?`LOCATION:${icsEsc(ev.location)}`:"", ev.notes?`DESCRIPTION:${icsEsc(ev.notes)}`:"", ev.url?`URL:${ev.url}`:"",
    "END:VEVENT","END:VCALENDAR"].filter(Boolean).map(fold75);
  const blob = new Blob([lines.join("\r\n")+"\r\n"], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name.replace(/[^\w-]+/g,"-").replace(/-+/g,"-").toLowerCase()+".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("Calendar file downloaded. Open it to add the event.");
}
const firstTime = t => (t||"").match(/\d{1,2}:\d{2}/)?.[0];
const plusMin = (t, m) => { const [h,mm]=t.split(":").map(Number); const x=h*60+mm+m; return `${String(Math.floor(x/60)%24).padStart(2,"0")}:${String(x%60).padStart(2,"0")}`; };

function eventToCal(x, on){
  const loc = x.where + (x.where.includes(x.town) ? "" : ", "+x.town);
  const t = firstTime(x.time);
  if (isExpo(x)) {
    const day = on || x.e;
    return {uid:x.id+"-"+day, title:`${on?"":"Last day: "}${x.t}`, start:day, allDay:true, location:loc, notes:x.d+"\n"+x.url, url:x.url};
  }
  const day = on || nextDate(x);
  if (t) return {uid:x.id+"-"+day, title:x.t, start:day, startTime:t, endTime:plusMin(t,120), endDate: plusMin(t,120) < t ? iso(add(pd(day),1)) : day, location:loc, notes:x.d+"\n"+x.url, url:x.url};
  if (!on && isRun(x)) return {uid:x.id, title:x.t, start:x.s, end:x.e, allDay:true, location:loc, notes:x.d+"\n"+x.url, url:x.url};
  return {uid:x.id+"-"+day, title:x.t, start:day, allDay:true, location:loc, notes:"Check the event page for the time.\n"+x.d+"\n"+x.url, url:x.url};
}

/* ---------- weather (Open-Meteo, no key) ---------- */
let WX = null, wxState = "idle";
const WXC = c => c===0?["☀️","clear"]:c<=2?["⛅","partly cloudy"]:c===3?["☁️","cloudy"]:c<=48?["🌫️","foggy"]:c<=57?["🌦️","drizzle"]:c<=67?["🌧️","rain"]:c<=77?["🌨️","snow"]:c<=82?["🌦️","showers"]:["⛈️","thunderstorms"];
async function loadWeather(){
  if (wxState!=="idle") return;
  wxState = "loading";
  try {
    const u = "https://api.open-meteo.com/v1/forecast?latitude=52.16&longitude=4.49&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FAmsterdam&forecast_days=16";
    const r = await fetch(u); if (!r.ok) throw 0;
    const j = await r.json(); WX = {};
    j.daily.time.forEach((d,i)=>{ WX[d] = {code:j.daily.weather_code[i], tmax:j.daily.temperature_2m_max[i], tmin:j.daily.temperature_2m_min[i], psum:j.daily.precipitation_sum[i], pp:j.daily.precipitation_probability_max[i] ?? 0, wind:j.daily.wind_speed_10m_max[i]}; });
    wxState = "ok";
  } catch(_) { wxState = "error"; }
  if (!query && (tab==="plan" || tab==="home")) { if (tab==="plan") suggestAll(); wxFresh = true; render(); }
}
function wxFor(day){
  const w = WX && WX[day];
  if (!w) return {known:false};
  const wet = w.pp>=55 || w.psum>=3 || (w.code>=51 && w.code<=99 && w.pp>=50);
  const calm = w.wind < 22;
  return {...w, known:true, wet, dryCalm: !wet && w.pp<35 && calm, calm, cold: w.tmax<11};
}

/* ---------- date ideas ---------- */
const nextSat = (() => { const d = dow===6 ? today : add(today, 6-dow); return iso(d); })();
let P = load("uil-plan", null);
if (!P || !P.date || P.date < TODAY) P = {date:nextSat, part:"eve", vibe:"surprise", budget:2, indoor:false};
let current = []; // three ideas on screen
let shuffledAway = new Set();

const usedRecently = () => { const s=new Set(); ideas.forEach(it=>it.stops.forEach(st=>{ if (st.anchor) s.add(st.id); })); return s; };
const rnd = n => Math.random()*n;
const slotOf = x => { const t=firstTime(x.time); if (t) return +t.slice(0,2) >= 17 ? "eve" : "day"; return x.slot; };

function anchorPool(day, part, w){
  const used = usedRecently();
  const pool = [];
  E.forEach(x=>{
    if (x.noIdea || !occurs(x, day) || ended(x)) return;
    const sl = slotOf(x);
    if (!(sl==="any" || sl===part)) return;
    if (x.c > P.budget) return;
    if (x.io==="out" && P.indoor) return;
    if (w.known && x.dry && w.wet) return;
    if (w.known && x.calm && !w.dryCalm) return;
    if (x.long && part!=="day") return;
    if (x.months && !x.months.includes(pd(day).getMonth())) return;
    let s = rnd(2);
    if (isEvergreen(x)) s += 1; else if (isExpo(x)) s += 2 + (daysBetween(day, x.e) <= 21 ? 1 : 0); else s += 3.5;
    if (x.hl) s += 1;
    if (P.vibe==="surprise") s += rnd(3); else if (x.v.includes(P.vibe)) s += 3;
    if (w.known){ if (x.io==="out" && w.wet) s -= 5; if (x.io==="out" && w.dryCalm) s += 2.5; if (x.io==="in" && w.wet) s += 1; if (x.io==="out" && w.cold) s -= 1; }
    if (used.has(x.id)) s -= 4;
    if (shuffledAway.has(x.id)) s -= 6;
    pool.push({x, s});
  });
  // A lit-canal walk can anchor an evening when nothing else is on.
  if (part==="eve" && !P.indoor && !(w.known && w.wet)) pool.push({x:{...STOPS.find(s=>s.id==="lights"), cat:"Outdoors", town:"Leiden", where:"City centre"}, s:rnd(1.5)});
  pool.sort((a,b)=>b.s-a.s);
  if (w.known && w.wet && pool.filter(p=>p.x.io==="in").length >= 3) return pool.filter(p=>p.x.io==="in");
  return pool;
}

function pickStop(part, kinds, w, avoid, ok = () => true){
  const day = pd(P.date).getDay();
  const pool = STOPS.filter(s=>ok(s) && s.part.includes(part) && kinds.includes(s.kind) && s.c<=P.budget && !avoid.has(s.id)
    && !(P.indoor && s.io==="out") && !(s.days && !s.days.includes(day)) && !(w.known && s.dry && w.wet) && !(s.io==="out" && w.known && w.wet));
  if (!pool.length) return null;
  const sc = s => rnd(2) + (P.vibe!=="surprise" && s.v.includes(P.vibe) ? 2 : 0) + (s.cold && w.known && w.cold ? 2 : 0)
    + (s.io==="out" && w.dryCalm ? 1 : 0) + (P.budget>=3 && s.c===3 ? 2 : 0) + (P.budget===0 && s.c===0 ? 1 : 0) - Math.abs(Math.min(P.budget,2)-s.c)*0.5;
  return pool.map(s=>({s, v:sc(s)})).sort((a,b)=>b.v-a.v)[0].s;
}

function stopFrom(x, time, anchor){
  const isStop = !!x.kind;
  let note = x.d;
  if (isExpo(x)) { const dl=daysBetween(P.date,x.e); note = (dl<=21 ? `Closes ${shortNice(x.e)}. ` : "") + x.d; }
  return {id:x.id, t:x.t, url:x.url||"", where:x.where||"", town:x.town||"Leiden", note, time, c:x.c, io:x.io, anchor:!!anchor, kind:isStop?x.kind:"event", dur: x.long?240 : x.short?45 : isExpo(x)?90 : isStop?(x.kind==="drink"?75:90) : 120};
}

function buildIdea(anchors, w, avoid){
  const part = P.part;
  const stops = [];
  if (part==="day" || part==="whole") {
    const a = anchors.day; if (!a) return null;
    const t = firstTime(a.time) || (a.long ? "11:00" : "13:30");
    stops.push(stopFrom(a, t, true));
    const late = !a.long && !(w.known && w.wet) && !P.indoor && Math.random()<0.3 ? STOPS.find(s=>s.id==="beachsun" && s.c<=P.budget && !avoid.has(s.id)) : null;
    const sunset = SUNSET[pd(P.date).getMonth()], beachAt = plusMin(sunset, -40);
    if (part==="day") {
      // Lunch and the market go before the main stop; everything else after it.
      const canBefore = t >= "13:00";
      const f = pickStop("day", ["food"], w, avoid, s => (!s.before || canBefore) && s.not!==a.id);
      if (f) { avoid.add(f.id); stops.push(stopFrom(f, f.before ? plusMin(t, -100) : plusMin(t, stops[0].dur+20))); }
      const lastStop = [...stops].sort((x,y)=>x.time.localeCompare(y.time)).at(-1);
      if (late && stops.length<3 && beachAt > plusMin(lastStop.time, lastStop.dur+30)) { avoid.add(late.id); stops.push(stopFrom(late, beachAt)); }
      else if (a.short && stops.length<3) { const s=pickStop("day",["stroll"],w,avoid); if (s){ avoid.add(s.id); stops.push(stopFrom(s, plusMin(stops.at(-1).time, 90))); } }
    }
  }
  if (part==="eve" || part==="whole") {
    const e = anchors.eve;
    const din = pickStop("eve", ["food"], w, avoid);
    if (din) avoid.add(din.id);
    if (e) {
      const et = firstTime(e.time) || (e.kind==="stroll" ? "21:00" : "20:00");
      const early = +et.slice(0,2) < 19;
      if (din && !early) stops.push(stopFrom(din, plusMin(et, -120)));
      stops.push(stopFrom(e, et, !e.kind));
      if (din && early) stops.push(stopFrom(din, plusMin(et, 90)));
      if (part==="eve" && stops.length<3 && e.kind!=="stroll") {
        const d = pickStop("eve", ["drink","stroll"], w, avoid);
        if (d) { avoid.add(d.id); stops.push(stopFrom(d, plusMin(stops.at(-1).time, stops.at(-1).dur+15))); }
      }
    } else if (din) stops.push(stopFrom(din, "18:30"));
  }
  if (part==="whole" && stops.length<3) { const f = pickStop("day",["food"],w,avoid, s=>!s.before && s.not!==stops[0].id); if (f){ avoid.add(f.id); stops.splice(1,0,stopFrom(f, plusMin(stops[0].time, stops[0].dur+20))); } }
  stops.sort((a,b)=>a.time.localeCompare(b.time));
  if (stops.length < 2) return null;
  return finishIdea(stops, w);
}

function finishIdea(stops, w){
  const towns = [...new Set(stops.map(s=>s.town))];
  const cost = Math.max(...stops.map(s=>s.c));
  const out = stops.filter(s=>s.io==="out");
  let why;
  if (!w.known) why = wxState==="error" ? "Couldn't load the forecast, so check the weather before you go." : `No forecast yet for ${shortNice(P.date)} (it reaches about two weeks ahead).` + (out.length ? ` ${out[0].t} is outdoors, so have an indoor backup.` : " Everything here is indoors anyway.");
  else {
    const [, desc] = WXC(w.code);
    const base = `${Math.round(w.tmax)}° and ${desc}, ${w.pp}% chance of rain`;
    if (w.wet && out.length) why = `${base}. ${out[0].t} is outdoors, so bring rain jackets or swap it for a museum.`;
    else if (w.wet) why = `${base}. Rain is likely, so this plan stays indoors.`;
    else if (w.dryCalm && out.length) why = `${base}, light wind. Good weather for ${out[0].t}.`;
    else if (out.length) why = `${base}. Should stay dry enough for the outdoor part, but bring a jacket.`;
    else why = `${base}. All indoors, so the weather doesn't matter.`;
    if (w.cold && stops.some(s=>s.id==="choc")) why += " Cold enough to earn that hot chocolate.";
  }
  const title = stops.map(s=>s.t.length>34 ? s.t.split(/[:–(]/)[0].trim() : s.t).join(" → ");
  return {id: P.date+"|"+stops.map(s=>s.id).join("+"), date:P.date, part:P.part, title, stops, towns, cost, why, created:TODAY};
}

function suggestAll(){
  const w = wxFor(P.date);
  const dayPool = (P.part==="eve") ? [] : anchorPool(P.date, "day", w);
  const evePool = (P.part==="day") ? [] : anchorPool(P.date, "eve", w);
  const usedA = new Set(), avoid = new Set(), out = [];
  const take = pool => { const c = pool.filter(p=>!usedA.has(p.x.id)); if (!c.length) return null; const pick = c[Math.min(c.length-1, Math.floor(rnd(Math.min(2,c.length))))].x; usedA.add(pick.id); return pick; };
  for (let i=0; i<3; i++){
    // Let each idea reuse food stops from the others only when the pool runs dry.
    const a = {day: P.part==="eve" ? null : take(dayPool), eve: P.part==="day" ? null : take(evePool)};
    if (!a.day && !a.eve) break;
    const idea = buildIdea(a, w, avoid) || buildIdea(a, w, new Set());
    if (idea) out.push(idea);
  }
  current = out;
}
function shuffleOne(i){
  current[i]?.stops.forEach(s=>{ if (s.anchor || s.kind==="stroll") shuffledAway.add(s.id); });
  const w = wxFor(P.date);
  const otherA = new Set(), avoid = new Set();
  current.forEach((it,j)=>{ if (j!==i) it.stops.forEach(s=>{ otherA.add(s.id); avoid.add(s.id); }); });
  const pickFrom = pool => { const c = pool.filter(p=>!otherA.has(p.x.id)); return c.length ? c[Math.floor(rnd(Math.min(3,c.length)))].x : null; };
  const a = {day: P.part==="eve" ? null : pickFrom(anchorPool(P.date,"day",w))};
  if (a.day) otherA.add(a.day.id);
  a.eve = P.part==="day" ? null : pickFrom(anchorPool(P.date,"eve",w));
  const idea = (a.day||a.eve) && (buildIdea(a, w, avoid) || buildIdea(a, w, new Set()));
  if (idea) current[i] = idea; else toast("No other options for this day and budget.");
}

// Rough Leiden sunset per month (local time, DST included).
const SUNSET = ["16:55","17:45","18:35","20:25","21:15","22:00","21:55","21:05","20:00","18:55","17:00","16:30"];
const euro = c => c===0 ? "Free" : "€".repeat(c);
const PARTS = [["day","Afternoon"],["eve","Evening"],["whole","Whole day"]];
const VIBES = [["cosy","Cosy"],["active","Active"],["cultural","Cultural"],["surprise","Surprise"]];
const BUDGETS = [[0,"Free"],[1,"€"],[2,"€€"],[3,"€€€"]];
const seg = (name, opts, val) => { const id = "seg-"+name.replace(/\W+/g,"").toLowerCase();
  return `<span class="flabel" id="${id}">${name}</span><div class="seg" role="radiogroup" aria-labelledby="${id}" style="--n:${opts.length}">${opts.map(([v,l])=>`<label class="seg-opt"><input type="radio" name="${name}" value="${v}" ${String(v)===String(val)?"checked":""}><span>${l}</span></label>`).join("")}</div>`; };

let reIdx = -1; // idea card to re-animate after a shuffle
function renderPlanner(){
  const w = wxFor(P.date);
  let wx;
  if (w.known) { const [ic,desc]=WXC(w.code); wx = `<span class="wxi" aria-hidden="true">${ic}</span><span><b>${nice(P.date)} · ${Math.round(w.tmax)}°, ${desc}</b><span class="wxd">Low ${Math.round(w.tmin)}° · ${w.pp}% chance of rain · wind ${Math.round(w.wind)} km/h</span></span>`; }
  else wx = `<span class="wxi" aria-hidden="true">🗓️</span><span class="wxd">${wxState==="loading"||wxState==="idle" ? "Loading the forecast…" : wxState==="error" ? "Couldn't load the forecast. Ideas are picked without the weather." : `No forecast yet for ${shortNice(P.date)}. It reaches about two weeks ahead.`}</span>`;
  const list = current.length
    ? current.map((it,i)=>ideaCard(it,{i})).join("") + (current.length<3 ? `<p class="note">That's all that fits ${nice(P.date)} with these filters${w.known&&w.wet?" and the rain":""}. Try another part of the day or a bigger budget for more.</p>` : "")
    : `<div class="empty"><span class="emptyico">✦</span><b>Nothing fits</b><p>Try a bigger budget, another part of the day, or turn off Indoor only for ${nice(P.date)}.</p></div>`;
  return `<div class="planwrap">
    <div class="planside rv" style="--d:1">
      <form class="planner" id="planform" onsubmit="return false">
        <div class="inrow field">
          <div><label class="flabel" for="pdate">Day</label><input type="date" id="pdate" value="${P.date}" min="${TODAY}"></div>
          <label class="switch"><input type="checkbox" role="switch" id="pindoor" ${P.indoor?"checked":""}><span>Indoor only</span></label>
        </div>
        <div class="field">${seg("Part of day", PARTS, P.part)}</div>
        <div class="field">${seg("Vibe", VIBES, P.vibe)}</div>
        <div class="field">${seg("Budget", BUDGETS, P.budget)}</div>
      </form>
      <div class="wx">${wx}</div>
    </div>
    <div class="planmain">${list}<div class="cta"><button class="btn" type="button" id="reroll">${SHUFFLE} Three new ideas</button></div></div>
  </div>`;
}

function ideaCard(it, {i, saved:inSaved}){
  const rec = ideas.find(x=>x.id===it.id);
  const isSaved = !!rec, isDone = rec?.status==="done";
  const label = inSaved ? `${shortNice(it.date)} · ${PARTS.find(p=>p[0]===it.part)?.[1]||""}${isDone?" · Done":""}` : `Idea ${i+1}`;
  const k = inSaved ? `s${i}` : `c${i}`;
  return `<article class="idea rv${!inSaved && i===reIdx ? " re" : ""}${isDone?" done":""}" style="--d:${i+2}">
    <p class="ideahd">${esc(label)}</p>
    <h3 class="ideatitle">${esc(it.title)}</h3>
    <div class="meta"><span class="tag">${esc(it.towns.join(" · "))}</span><span>${euro(it.cost)}${it.cost?" per person, roughly":""}</span></div>
    <ol class="stops">${it.stops.map(s=>`<li><span class="tm">${s.time}</span><div><div class="st">${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.t)}</a>`:esc(s.t)}</div><div class="nt">${esc(s.where && s.kind==="event" ? s.where+". " : "")}${esc(s.note)}</div></div></li>`).join("")}</ol>
    <p class="why"><b>Weather:</b> ${esc(it.why)}</p>
    <div class="ideabtns">
      <button class="btn" type="button" data-act="save" data-k="${k}" aria-pressed="${isSaved}">${isSaved?STAR_ON+" Saved":STAR+" Save"}</button>
      ${inSaved ? "" : `<button class="btn" type="button" data-act="shuffle" data-k="${k}">${SHUFFLE} Shuffle</button>`}
      <button class="btn" type="button" data-act="cal" data-k="${k}">${CAL_SVG} Calendar</button>
      <button class="btn" type="button" data-act="copy" data-k="${k}">${COPY} Copy message</button>
      <button class="btn" type="button" data-act="done" data-k="${k}" aria-pressed="${isDone}">${CHECK} ${isDone?"Done":"Mark done"}</button>
    </div>
  </article>`;
}

function messageFor(it){
  const d = pd(it.date);
  const when = it.date===TODAY ? "today" : it.date===iso(add(today,1)) ? "tomorrow" : `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  const parts = it.stops.map((s,j)=> (j===0 ? "" : j===it.stops.length-1 ? " and then " : ", then ") + `${j && s.kind!=="event" ? s.t.charAt(0).toLowerCase()+s.t.slice(1) : s.t} (${s.time})`).join("");
  const w = wxFor(it.date);
  const wx = w.known ? (w.wet ? " Looks rainy, so it's all indoors." : ` Forecast says ${Math.round(w.tmax)}° and ${WXC(w.code)[1]}.`) : "";
  return `Date idea for ${when}: ${parts}.${wx} You in? ❤️`;
}
function ideaToCal(it){
  const first = it.stops[0], last = it.stops.at(-1);
  const end = plusMin(last.time, last.dur);
  return {uid:it.id.replace(/[^\w]+/g,"-"), title:"Date: "+it.title, start:it.date, startTime:first.time, endTime:end, endDate: end < first.time ? iso(add(pd(it.date),1)) : it.date,
    location: it.stops.find(s=>s.kind==="event")?.where || it.towns[0],
    notes: it.stops.map(s=>`${s.time}  ${s.t}${s.where&&s.kind==="event"?" ("+s.where+")":""}${s.url?"\n       "+s.url:""}`).join("\n") + "\n\n" + it.why};
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"), 2600); }

/* ---------- events ---------- */
function go(k){

// Frosted header appears once content scrolls underneath it.

let qT; $("q").addEventListener("input", e=>{ clearTimeout(qT); qT = setTimeout(()=>{ const was = !!query; query = e.target.value.trim(); render(was !== !!query); }, 140); });

// Tilt and glare follow the pointer on cards and tiles (mouse/trackpad only).
if (motionOK && matchMedia("(hover:hover) and (pointer:fine)").matches) {
  document.addEventListener("pointermove", e=>{
    const el = e.target.closest?.("[data-tilt]"); if (!el) return;
    const r = el.getBoundingClientRect(), px = (e.clientX-r.left)/r.width, py = (e.clientY-r.top)/r.height;
    el.style.setProperty("--rx", ((.5-py)*7).toFixed(2)+"deg"); el.style.setProperty("--ry", ((px-.5)*9).toFixed(2)+"deg");
    el.style.setProperty("--mx", (px*100).toFixed(1)+"%"); el.style.setProperty("--my", (py*100).toFixed(1)+"%");
    el.classList.add("tilting");
  }, {passive:true});
  document.addEventListener("pointerout", e=>{
    const el = e.target.closest?.("[data-tilt]");
    if (el && !el.contains(e.relatedTarget)) { el.classList.remove("tilting"); el.style.setProperty("--rx","0deg"); el.style.setProperty("--ry","0deg"); }
  }, {passive:true});
}

$("out").addEventListener("click", async e=>{
  const sc = e.target.closest("[data-scroll]");
  if (sc) { const r = sc.closest(".sec").querySelector(".rail"); r.scrollBy({left: +sc.dataset.scroll * r.clientWidth * .85, behavior: motionOK ? "smooth" : "auto"}); return; }
  const chip = e.target.closest("[data-c]");
  if (chip) { cat = chip.dataset.c; render(true); return; }
  const star = e.target.closest(".star");
  if (star){ const id = star.dataset.id; const on = !saved.has(id); on ? saved.add(id) : saved.delete(id); persist();
    // Keep rails where they were while the view redraws.
    const rails = [...$("out").querySelectorAll(".rail")].map(r=>r.scrollLeft);
    render(); $("out").querySelectorAll(".rail").forEach((r,i)=>{ r.scrollLeft = rails[i] || 0; });
    if (on) $("out").querySelectorAll(`.star[data-id="${id}"]`).forEach(b=>b.classList.add("pop"));
    toast(on ? "Saved. Find it under Saved." : "Removed from saved."); return; }
  const cal = e.target.closest("[data-cal]");
  if (cal){ const x = E.find(y=>y.id===cal.dataset.cal); downloadIcs(x.t, eventToCal(x, cal.dataset.on)); return; }
  if (e.target.closest("#reroll")){ current.forEach(it=>it.stops.forEach(s=>{ if (s.anchor) shuffledAway.add(s.id); })); suggestAll(); render(true); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const k = b.dataset.k, it = k[0]==="s" ? ideas[+k.slice(1)] : current[+k.slice(1)];
  if (!it) return;
  const idx = ideas.findIndex(x=>x.id===it.id);
  switch (b.dataset.act){
    case "save":
      if (idx>=0) { ideas.splice(idx,1); toast("Removed from saved."); } else { ideas.unshift({...it, status:"saved"}); toast("Saved. Find it under Saved."); }
      persist(); render(); break;
    case "done":
      if (idx>=0 && ideas[idx].status==="done") ideas[idx].status = "saved";
      else if (idx>=0) ideas[idx].status = "done";
      else ideas.unshift({...it, status:"done"});
      if (ideas[idx>=0?idx:0].status==="done") toast("Marked as done. It won't come up again soon.");
      persist(); render(); break;
    case "shuffle": reIdx = +k.slice(1); shuffleOne(reIdx); render(); reIdx = -1; break;
    case "cal": downloadIcs("date-"+it.date, ideaToCal(it)); break;
    case "copy": {
      const msg = messageFor(it);
      try { await navigator.clipboard.writeText(msg); toast("Copied. Paste it into WhatsApp."); }
      catch(_) { window.prompt("Copy this message:", msg); }
      break;
    }
  }
});
$("out").addEventListener("change", e=>{
  const f = e.target;
  if (f.id==="pdate"){ if (!f.value) return; P.date = f.value < TODAY ? TODAY : f.value; }
  else if (f.id==="pindoor") P.indoor = f.checked;
  else if (f.name==="Part of day") P.part = f.value;
  else if (f.name==="Vibe") P.vibe = f.value;
  else if (f.name==="Budget") P.budget = +f.value;
  else return;
  store("uil-plan", P); shuffledAway = new Set(); suggestAll();
  // Redraw only the ideas so the form keeps focus and the segmented thumb can slide.
  const tmp = document.createElement("div"); tmp.innerHTML = renderPlanner();
  document.querySelector(".planmain").replaceWith(tmp.querySelector(".planmain"));
  document.querySelector(".planside .wx").replaceWith(tmp.querySelector(".wx"));
  document.querySelectorAll(".planmain .idea").forEach(c=>c.classList.add("re"));
});

$("updated").textContent = `Agenda updated ${nice(UPDATED)} from ${SOURCES || "Visit Leiden"}, plus a few hand-picked events.`;
if (tab==="plan") suggestAll();
loadWeather();
render(true);
document.fonts?.ready.then(movePill);
</script>
