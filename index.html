<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uit in Leiden</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("uil-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta name="description" content="What's on in and around Leiden, plus date ideas that check the weather.">
<meta name="theme-color" content="#f7f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09080d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cg fill='none' stroke='%23b5121b' stroke-width='4' stroke-linecap='round'%3E%3Cg transform='rotate(45 24 24)'%3E%3Ccircle cx='24' cy='9' r='5'/%3E%3Cpath d='M24 14v28M24 34h6M24 39h5'/%3E%3C/g%3E%3Cg transform='rotate(-45 24 24)'%3E%3Ccircle cx='24' cy='9' r='5'/%3E%3Cpath d='M24 14v28M24 34h-6M24 39h-5'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: bento home over a slow-drifting gradient glow; frosted header with a sliding nav pill;
   swipeable rows of gradient-cover event cards; agenda views as card grids grouped by day. */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{
  --bg:#f7f4f6; --fg:#17141b; --muted:#6c6873; --line:rgba(23,20,27,.08); --line-strong:rgba(23,20,27,.15);
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,255,255,.8); --glass-edge:rgba(255,255,255,.8);
  --card:rgba(255,255,255,.9); --fill:rgba(23,20,27,.06); --fill-hover:rgba(23,20,27,.1); --thumb:#fff; --badge:rgba(255,255,255,.92); --badge-fg:#17141b;
  --red:#d0142c; --red-soft:rgba(208,20,44,.1); --canal:#1f8a99; --amber:#a86400; --amber-soft:rgba(245,158,11,.16);
  --g1:#ff4d5e; --g2:#ff9966; --g3:#2bb6c4; --g4:#8b5cf6; --glow-o:.5;
  --shadow:0 1px 2px rgba(30,10,30,.04),0 10px 28px -12px rgba(60,10,50,.18);
  --shadow-hi:0 2px 4px rgba(30,10,30,.05),0 28px 56px -20px rgba(80,10,60,.32);
  --toast:rgba(23,20,27,.88); --toast-fg:#fff;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --settle:cubic-bezier(.2,.9,.25,1); --spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09080d; --fg:#f5f2f8; --muted:#a39fae; --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --glass:rgba(28,25,36,.5); --glass-strong:rgba(32,29,42,.72); --glass-edge:rgba(255,255,255,.09);
  --card:rgba(24,21,31,.86); --fill:rgba(255,255,255,.07); --fill-hover:rgba(255,255,255,.12); --thumb:rgba(255,255,255,.2); --badge:rgba(16,14,22,.82); --badge-fg:#fff;
  --red:#ff5d6c; --red-soft:rgba(255,93,108,.16); --canal:#62d3df; --amber:#f6b54a; --amber-soft:rgba(246,181,74,.15);
  --glow-o:.42; --shadow:0 0 0 .5px rgba(255,255,255,.05),0 14px 32px -14px rgba(0,0,0,.7); --shadow-hi:0 0 0 .5px rgba(255,255,255,.08),0 30px 60px -20px rgba(0,0,0,.8);
  --toast:rgba(46,42,56,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09080d; --fg:#f5f2f8; --muted:#a39fae; --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --glass:rgba(28,25,36,.5); --glass-strong:rgba(32,29,42,.72); --glass-edge:rgba(255,255,255,.09);
  --card:rgba(24,21,31,.86); --fill:rgba(255,255,255,.07); --fill-hover:rgba(255,255,255,.12); --thumb:rgba(255,255,255,.2); --badge:rgba(16,14,22,.82); --badge-fg:#fff;
  --red:#ff5d6c; --red-soft:rgba(255,93,108,.16); --canal:#62d3df; --amber:#f6b54a; --amber-soft:rgba(246,181,74,.15);
  --glow-o:.42; --shadow:0 0 0 .5px rgba(255,255,255,.05),0 14px 32px -14px rgba(0,0,0,.7); --shadow-hi:0 0 0 .5px rgba(255,255,255,.08),0 30px 60px -20px rgba(0,0,0,.8);
  --toast:rgba(46,42,56,.88); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 .9375rem/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
a{color:inherit}
svg{display:block}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:is(a,button,input,.seg-opt):focus-visible{outline:2px solid var(--g4);outline-offset:3px;border-radius:.75rem}

/* ---- Ambient glow: soft colour fields drifting behind everything ---- */
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.glow i{position:absolute;border-radius:50%;opacity:var(--glow-o);filter:blur(48px);will-change:transform}
.glow .b1{width:62vmax;height:62vmax;left:-22vmax;top:-30vmax;background:radial-gradient(circle,var(--g1) 0,transparent 62%);animation:d1 26s ease-in-out infinite alternate}
.glow .b2{width:54vmax;height:54vmax;right:-22vmax;top:-20vmax;background:radial-gradient(circle,var(--g4) 0,transparent 62%);animation:d2 32s ease-in-out infinite alternate}
.glow .b3{width:70vmax;height:70vmax;left:5vmax;bottom:-46vmax;background:radial-gradient(circle,var(--g3) 0,transparent 62%);animation:d3 38s ease-in-out infinite alternate}
.glow .b4{width:50vmax;height:50vmax;right:-16vmax;bottom:-30vmax;background:radial-gradient(circle,var(--g2) 0,transparent 62%);animation:d4 29s ease-in-out infinite alternate}
@keyframes d1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(14vmax,10vmax) scale(1.18)}100%{transform:translate(4vmax,22vmax) scale(.92)}}
@keyframes d2{0%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-16vmax,14vmax) scale(.9)}100%{transform:translate(-6vmax,4vmax) scale(1.2)}}
@keyframes d3{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18vmax,-12vmax) scale(1.12)}100%{transform:translate(-10vmax,-4vmax) scale(.95)}}
@keyframes d4{0%{transform:translate(0,0) scale(.95)}50%{transform:translate(-12vmax,-16vmax) scale(1.15)}100%{transform:translate(6vmax,-6vmax) scale(1)}}

/* ---- Header ---- */
.top{position:sticky;top:0;z-index:30;padding:.75rem 0 .625rem}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border-bottom:.5px solid var(--line);opacity:0;transition:opacity .35s ease}
.top.scrolled::before{opacity:1}
.topin{max-width:70rem;margin:0 auto;padding:0 1rem;display:flex;align-items:center;gap:1rem}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.1875rem;letter-spacing:-.025em;flex:none}
.brand svg{width:1.875rem;height:1.875rem;transition:transform .7s var(--spring)}
@media (hover:hover){.brand:hover svg{transform:rotate(-18deg) scale(1.08)}}
.search{position:relative;flex:1;max-width:22rem;margin-left:auto}
.search input{width:100%;height:2.5rem;font-size:.9375rem;border-radius:999px;padding:0 1rem 0 2.5rem;outline:none;background:var(--glass-strong);border:.5px solid var(--glass-edge);
  box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:box-shadow .3s ease,background-color .3s ease}
.search input::placeholder{color:var(--muted)}
.search input:focus{box-shadow:var(--shadow),0 0 0 4px color-mix(in srgb,var(--g4) 22%,transparent)}
.search svg{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;color:var(--muted);pointer-events:none;z-index:1}
.nav{position:relative;display:flex;width:max-content;max-width:calc(100% - 2rem);margin:.75rem auto 0;padding:.25rem;border-radius:999px;background:var(--glass-strong);
  border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.navpill{position:absolute;top:.25rem;bottom:.25rem;left:.25rem;width:0;border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px -6px rgba(0,0,0,.2);
  transition:transform .5s var(--settle),width .5s var(--settle),background .4s ease,opacity .2s}
.nav[data-k="plan"] .navpill{background:linear-gradient(120deg,var(--g1),var(--g2))}
.navbtns{position:relative;z-index:1;display:flex;gap:.125rem}
.navbtn{border:0;background:none;padding:.5rem 1rem;border-radius:999px;font-weight:600;font-size:.875rem;letter-spacing:-.005em;color:var(--muted);display:inline-flex;gap:.375rem;align-items:center;white-space:nowrap;cursor:pointer;transition:color .3s ease,transform .12s ease-out}
.navbtn:active{transform:scale(.95)}
.navbtn[aria-selected="true"]{color:var(--fg)}
.navbtn.plan .nheart{color:var(--g1);width:.95rem;height:.95rem;display:inline-grid}
.nav[data-k="plan"] .navbtn.plan{color:#fff}
.nav[data-k="plan"] .navbtn.plan .nheart{color:#fff}
.count{font:600 .6875rem var(--mono);font-variant-numeric:tabular-nums;background:var(--fill);color:var(--muted);border-radius:999px;padding:.05rem .4rem;margin-left:.125rem}

.wrap{max-width:70rem;margin:0 auto;padding:1rem 1rem 3rem}

/* ---- Motion: entrances, scroll reveals ---- */
.motion #out.in .rv{animation:rise .75s var(--settle) both;animation-delay:calc(var(--d,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.motion .sr{transition:opacity .9s var(--settle),transform .9s var(--settle)}
.motion .sr:not(.seen){opacity:0;transform:translateY(32px)}
.motion .idea.re{animation:rise .6s var(--settle) both}
@keyframes shimmer{to{background-position:-300% 0}}
@keyframes floaty{from{transform:translateY(0) rotate(0)}to{transform:translateY(-6px) rotate(4deg)}}
@keyframes beat{0%,60%,100%{transform:scale(1)}10%{transform:scale(1.2)}20%{transform:scale(1)}30%{transform:scale(1.12)}}
@keyframes spin{to{--ang:360deg}}
@keyframes pop{0%{transform:scale(.7)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

/* Tilt + glare on hover (pointer devices only; values set from JS) */
[data-tilt]{transition:transform .7s var(--settle),box-shadow .45s ease}
[data-tilt].tilting{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px)) scale(var(--press,1))}
[data-tilt].tilting{--lift:-5px;box-shadow:var(--shadow-hi);transition:transform .14s ease-out,box-shadow .3s ease}
[data-tilt]:active{--press:.985}
[data-tilt]::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s ease;z-index:3;
  background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.32),transparent 50%);mix-blend-mode:soft-light}
[data-tilt].tilting::after{opacity:1}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;gap:.4rem;border:0;cursor:pointer;text-decoration:none;font-weight:600;font-size:.875rem;letter-spacing:-.005em;
  background:var(--fill);border-radius:999px;padding:.55rem 1rem;min-height:2.375rem;transition:background-color .2s ease,transform .12s ease-out,color .2s}
.btn svg{width:1rem;height:1rem}
@media (hover:hover){.btn:hover{background:var(--fill-hover)}}
.btn:active{transform:scale(.96)}
.btn[aria-pressed="true"]{background:var(--red-soft);color:var(--red)}
.btn-glow{position:relative;display:inline-flex;align-items:center;gap:.5rem;border:0;cursor:pointer;text-decoration:none;color:#fff;font-weight:700;font-size:.9375rem;letter-spacing:-.01em;
  padding:.7rem 1.25rem;min-height:2.75rem;border-radius:999px;background:linear-gradient(120deg,var(--g1),var(--g2) 55%,var(--g1));background-size:200% 100%;
  box-shadow:0 8px 24px -8px color-mix(in srgb,var(--g1) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .14s ease-out,box-shadow .3s ease,background-position .6s var(--settle)}
.btn-glow svg{width:1.05rem;height:1.05rem}
@media (hover:hover){.btn-glow:hover{background-position:100% 0;box-shadow:0 12px 32px -8px color-mix(in srgb,var(--g1) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}}
.btn-glow:active{transform:scale(.96)}
.motion .btn-glow svg{animation:beat 2.4s ease-in-out infinite}

/* ---- Bento ---- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(10rem,auto);gap:1rem;margin-top:.5rem;
  grid-template-areas:"hello hello wx hl" "hello hello ton cls" "plan plan plan sav"}
.tile{position:relative;display:flex;flex-direction:column;gap:.25rem;padding:1.125rem 1.25rem;border-radius:1.625rem;overflow:hidden;text-decoration:none;color:inherit;
  background:var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%)}
.lbl{font-weight:700;font-size:.6875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:2.75rem;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:auto}
.tsub{font-size:.8125rem;color:var(--muted);line-height:1.35}
.t-hello{grid-area:hello;padding:2rem 2rem 1.75rem;justify-content:flex-end;gap:0;min-height:21rem}
.t-hello::before{content:"";position:absolute;width:24rem;height:24rem;right:-8rem;top:-10rem;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--g1) 40%,transparent),transparent 65%);pointer-events:none}
.hellokeys{position:absolute;right:1.5rem;top:1.5rem;width:4.5rem;height:4.5rem;opacity:.9}
.motion .hellokeys{animation:floaty 5s ease-in-out infinite alternate}
.hellosub{font-weight:600;color:var(--muted);font-size:.9375rem}
.hello{font-family:var(--display);font-weight:800;font-size:clamp(2.125rem,4.8vw,3.625rem);line-height:1.02;letter-spacing:-.04em;margin:.5rem 0 0;text-wrap:balance;max-width:14ch}
.grad{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g4),var(--g3),var(--g1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.motion .grad{animation:shimmer 12s linear infinite}
.hellodate{color:var(--muted);margin:.75rem 0 0;font-size:.9375rem}
.hellobtns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem}
.t-wx{grid-area:wx}
.wxnow{display:flex;align-items:center;gap:.5rem;margin-top:auto}
.wxbig{font-family:var(--display);font-weight:800;font-size:2.75rem;line-height:1;letter-spacing:-.04em}
.wxico{font-size:2.25rem;line-height:1}
.motion .wxico{animation:floaty 3.5s ease-in-out infinite alternate}
.wxdesc{margin:0;font-size:.8125rem;color:var(--muted)}
.wxnext{list-style:none;margin:.5rem 0 0;padding:.5rem 0 0;border-top:.5px solid var(--line-strong);display:flex;justify-content:space-between;font-size:.75rem}
.wxnext li{display:flex;flex-direction:column;align-items:center;gap:.05rem}
.wxnext span{color:var(--muted);font-weight:600}
.wxnext b{font-weight:600}
.wxload{margin-top:auto;color:var(--muted);font-size:.875rem}
.t-wx.fresh .wxnow,.t-wx.fresh .wxdesc,.t-wx.fresh .wxnext{animation:rise .6s var(--settle) both}
.t-hl{grid-area:hl;color:#fff;border-color:rgba(255,255,255,.2);background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--cc) 40%,#fff) 0,transparent 55%),linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 45%,#120818))}
.t-hl .lbl{color:rgba(255,255,255,.8)}
.hlglyph{position:absolute;right:-.5rem;bottom:-1.25rem;font-size:5.5rem;line-height:1;transform:rotate(-12deg);filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}
.motion .hlglyph{animation:floaty 4.5s ease-in-out infinite alternate}
.hltitle{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1;letter-spacing:-.025em;margin-top:auto;max-width:12ch;position:relative;z-index:1;text-wrap:balance;text-shadow:0 1px 10px rgba(0,0,0,.2)}
.hlsub{font-size:.8125rem;opacity:.9;position:relative;z-index:1;max-width:calc(100% - 3.5rem);text-shadow:0 1px 8px rgba(0,0,0,.25)}
.t-ton{grid-area:ton}
.mini{list-style:none;margin:.375rem 0 0;padding:0;font-size:.8125rem;line-height:1.3}
.mini li{display:flex;gap:.4rem;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini i{flex:none;width:.45rem;height:.45rem;border-radius:50%;background:var(--cc);transform:translateY(-.05rem)}
.t-cls{grid-area:cls}
.ringrow{position:relative;width:3.5rem;height:3.5rem;margin:.25rem 0 auto}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring-bg{stroke:var(--fill-hover)}
.ring-fg{stroke:url(#ringgrad);stroke-dasharray:var(--c);stroke-dashoffset:var(--off)}
.motion #out.in .ring-fg{animation:ring 1.4s var(--settle) .35s both}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.ringnum{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ringnum b{font-family:var(--display);font-weight:800;font-size:1.125rem;letter-spacing:-.03em}
.ringnum span{font-size:.5625rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.clsname{font-family:var(--display);font-weight:700;font-size:.9375rem;line-height:1.2;letter-spacing:-.015em;margin-top:.5rem}
.t-plan{grid-area:plan;flex-direction:row;align-items:center;gap:1.125rem;padding:1.25rem 1.5rem;min-height:7.5rem}
.t-plan::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),var(--g1),var(--g2),var(--g3),var(--g4),var(--g1));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.motion .t-plan::before{animation:spin 6s linear infinite}
.planglow{position:absolute;inset:-40%;background:conic-gradient(from var(--ang),transparent,color-mix(in srgb,var(--g1) 22%,transparent),transparent 30%,color-mix(in srgb,var(--g4) 22%,transparent),transparent 60%);filter:blur(30px);pointer-events:none}
.motion .planglow{animation:spin 10s linear infinite}
.heart{flex:none;width:3.5rem;height:3.5rem;border-radius:1.125rem;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 24px -8px color-mix(in srgb,var(--g1) 70%,transparent);position:relative}
.heart svg{width:1.6rem;height:1.6rem}
.motion .heart svg{animation:beat 2.4s ease-in-out infinite}
.plantitle{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;line-height:1.1}
.t-plan .tsub{font-size:.875rem;position:relative}
.t-plan>div{position:relative;flex:1}
.go{flex:none;width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;background:var(--fill);position:relative;transition:transform .5s var(--spring),background-color .3s}
.go svg{width:1.125rem;height:1.125rem}
@media (hover:hover){.t-plan:hover .go{transform:translateX(4px);background:var(--fg);color:var(--bg)}}
.t-plan:active{transform:scale(.99)}
.t-plan{transition:transform .14s ease-out}
.t-sav{grid-area:sav}

/* ---- Section rows ---- */
.sec{margin-top:2.75rem}
.sechd{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.sechd h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,2.8vw,1.875rem);line-height:1.05;letter-spacing:-.035em;margin:0}
.sechd p{margin:.3rem 0 0;color:var(--muted);font-size:.875rem}
.sechd-r{display:flex;gap:.375rem;align-items:center;flex:none}
.arrow{width:2.375rem;height:2.375rem;border-radius:50%;border:.5px solid var(--glass-edge);background:var(--glass-strong);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;transition:transform .12s ease-out,background-color .2s}
.arrow svg{width:1rem;height:1rem}
.arrow:active{transform:scale(.92)}
@media (hover:none){.arrow{display:none}}
.link{display:inline-flex;align-items:center;gap:.375rem;border:0;cursor:pointer;text-decoration:none;font-weight:600;font-size:.8125rem;background:var(--fg);color:var(--bg);border-radius:999px;padding:.5rem .875rem;transition:transform .12s ease-out}
.link:active{transform:scale(.95)}
.link .count{background:color-mix(in srgb,var(--bg) 20%,transparent);color:inherit}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(15.5rem,17.5rem);gap:1rem;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:1rem;
  margin:-.75rem -1rem 0;padding:.75rem 1rem 1.75rem;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 1rem,#000 calc(100% - 1rem),transparent);mask-image:linear-gradient(90deg,transparent,#000 1rem,#000 calc(100% - 1rem),transparent)}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}

/* ---- Event card ---- */
.card{position:relative;display:flex;flex-direction:column;border-radius:1.375rem;overflow:hidden;background:var(--card);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);min-width:0}
.cover{position:relative;height:7.5rem;flex:none;overflow:hidden;
  background:radial-gradient(130% 140% at 0% 0%,color-mix(in srgb,var(--cc) 35%,#fff) 0,transparent 55%),linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 42%,#140a1c))}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 100% 100%,rgba(255,255,255,.18),transparent 70%)}
.glyph{position:absolute;right:-.375rem;bottom:-1.125rem;font-size:5.25rem;line-height:1;transform:rotate(-12deg);filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));transition:transform .7s var(--spring)}
@media (hover:hover){.card:hover .glyph{transform:rotate(-2deg) scale(1.1) translateY(-6px)}}
.dbadge{position:absolute;left:.75rem;top:.75rem;display:flex;flex-direction:column;align-items:center;min-width:3.25rem;padding:.3rem .5rem .375rem;border-radius:.875rem;
  background:var(--badge);color:var(--badge-fg);box-shadow:0 6px 16px -6px rgba(0,0,0,.35);line-height:1.05;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dbadge span{font:600 .5625rem var(--mono);text-transform:uppercase;letter-spacing:.08em;opacity:.6}
.dbadge b{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.03em;white-space:nowrap}
.flags{position:absolute;left:.75rem;right:4.5rem;bottom:.625rem;display:flex;flex-wrap:wrap;gap:.3rem}
.catpill,.flag{font-weight:700;font-size:.6875rem;letter-spacing:.01em;padding:.15rem .55rem;border-radius:999px;line-height:1.45}
.catpill{color:#fff;background:rgba(255,255,255,.2);border:.5px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.flag{background:#fff;color:#c3122a}
.flag.new{color:#9a5b00}
.cbody{display:flex;flex-direction:column;flex:1;padding:.875rem 1rem 1rem}
.ctitle{font-family:var(--display);font-weight:700;font-size:1.0625rem;line-height:1.22;letter-spacing:-.018em;margin:0;text-wrap:pretty}
.ctitle a{text-decoration:none}
.ctitle a::before{content:"";position:absolute;inset:0;z-index:1}
.cmeta{margin:.3rem 0 0;font-size:.8125rem;color:var(--muted);line-height:1.35}
.cdesc{margin:.45rem 0 0;font-size:.84375rem;line-height:1.45;color:color-mix(in srgb,var(--fg) 82%,var(--muted));display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cacts{position:relative;z-index:2;display:flex;justify-content:flex-end;gap:.375rem;margin-top:auto;padding-top:.75rem}
.iconbtn{width:2.375rem;height:2.375rem;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--fg);transition:background-color .2s,color .2s,transform .12s ease-out}
.iconbtn svg{width:1.05rem;height:1.05rem}
@media (hover:hover){.iconbtn:hover{background:var(--fill-hover)}}
.iconbtn:active{transform:scale(.9)}
.star[aria-pressed="true"]{background:var(--red-soft);color:var(--red)}
.star.pop svg{animation:pop .45s var(--spring)}

/* ---- Agenda / saved / search views ---- */
.vhead{margin:1.25rem 0 1.25rem}
.vtitle{font-family:var(--display);font-weight:800;font-size:clamp(2.5rem,7vw,4.25rem);line-height:.98;letter-spacing:-.045em;margin:0;text-wrap:balance}
.vsub{color:var(--muted);margin:.625rem 0 0;max-width:60ch;font-size:1rem;line-height:1.45}
.pills{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin:0 -1rem;padding:.25rem 1rem .5rem}
.pills::-webkit-scrollbar{display:none}
.pillbtn{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;cursor:pointer;font-weight:600;font-size:.875rem;padding:.55rem 1rem;border-radius:999px;
  background:var(--glass-strong);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .12s ease-out,background-color .25s,color .25s}
.pillbtn:active{transform:scale(.95)}
.pillbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.pillbtn[aria-pressed="true"] .count{background:color-mix(in srgb,var(--bg) 20%,transparent);color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:.375rem;margin:.75rem 0 0}
.chip{display:inline-flex;align-items:center;gap:.45rem;cursor:pointer;font-weight:600;font-size:.8125rem;padding:.375rem .8rem;border-radius:999px;border:.5px solid var(--line-strong);background:transparent;transition:transform .12s ease-out,background-color .2s,color .2s}
.chip i{width:.5rem;height:.5rem;border-radius:50%;background:var(--cc)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day{display:flex;align-items:center;gap:.625rem;font-family:var(--display);font-weight:700;font-size:1.1875rem;letter-spacing:-.02em;margin:2.25rem 0 1rem}
.day::after{content:"";flex:1;height:.5px;background:var(--line-strong)}
.todaytag{font-family:var(--body);font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:linear-gradient(120deg,var(--g1),var(--g2));padding:.2rem .55rem;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:1rem}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,24rem),1fr));gap:1rem;align-items:start}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.375rem;padding:2.5rem 1.5rem;margin-top:1rem;border-radius:1.625rem;
  background:var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.empty b{font-family:var(--display);font-size:1.25rem;letter-spacing:-.02em}
.empty p{margin:0 0 .75rem;color:var(--muted);max-width:40ch}
.emptyico{font-size:2rem;background:linear-gradient(120deg,var(--g1),var(--g4));-webkit-background-clip:text;background-clip:text;color:transparent}
.note{color:var(--muted);font-size:.875rem;margin:.5rem .25rem 0}

/* ---- Planner ---- */
.planwrap{display:grid;grid-template-columns:minmax(18rem,23rem) minmax(0,1fr);gap:1.25rem;align-items:start}
.planside{position:sticky;top:8.5rem;display:flex;flex-direction:column;gap:1rem}
.planner{padding:1.25rem;border-radius:1.625rem;background:var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%)}
.field{margin:0 0 1rem}
.field:last-child{margin-bottom:0}
.flabel{display:block;font-weight:700;font-size:.6875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 .5rem .125rem}
.inrow{display:flex;flex-wrap:wrap;gap:.875rem 1.25rem;align-items:flex-end;justify-content:space-between}
input[type=date]{font-weight:600;font-size:.9375rem;background:var(--fill);border:0;border-radius:.75rem;padding:.5rem .75rem;min-height:2.375rem}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:.875rem;padding:3px;--i:0}
.seg-opt{position:relative;z-index:1;cursor:pointer;display:block}
.seg-opt input{position:absolute;opacity:0;pointer-events:none}
.seg-opt span{display:block;text-align:center;font-weight:600;font-size:.8125rem;padding:.5rem .25rem;border-radius:.6875rem;white-space:nowrap;color:var(--muted);transition:color .25s ease}
.seg-opt input:checked+span{color:var(--fg)}
.seg-opt:has(input:focus-visible) span{outline:2px solid var(--g4);outline-offset:1px}
@supports selector(:has(*)){
  .seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));background:var(--thumb);border-radius:.6875rem;
    box-shadow:0 3px 10px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transform:translateX(calc(var(--i) * 100%));transition:transform .45s var(--settle)}
  .seg:has(.seg-opt:nth-child(2) input:checked){--i:1}
  .seg:has(.seg-opt:nth-child(3) input:checked){--i:2}
  .seg:has(.seg-opt:nth-child(4) input:checked){--i:3}
}
@supports not selector(:has(*)){.seg-opt input:checked+span{background:var(--thumb)}}
.switch{display:inline-flex;gap:.625rem;align-items:center;font-size:.9375rem;font-weight:600;cursor:pointer;min-height:2.375rem}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:2.875rem;height:1.75rem;border-radius:999px;background:var(--fill-hover);position:relative;cursor:pointer;transition:background .3s ease;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:calc(1.75rem - 4px);height:calc(1.75rem - 4px);border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .4s var(--spring)}
.switch input:checked{background:linear-gradient(120deg,var(--g1),var(--g2))}
.switch input:checked::after{transform:translateX(1.125rem)}
.wx{display:flex;gap:.875rem;align-items:center;padding:1rem 1.125rem;border-radius:1.375rem;font-size:.875rem;line-height:1.4;
  background:linear-gradient(135deg,color-mix(in srgb,var(--g3) 22%,transparent),color-mix(in srgb,var(--g4) 14%,transparent)),var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.wx b{display:block;font-weight:700;font-size:.9375rem;letter-spacing:-.01em}
.wx .wxi{font-size:2.25rem;line-height:1;flex:none}
.motion .wx .wxi{animation:floaty 3.5s ease-in-out infinite alternate}
.wx .wxd{color:var(--muted)}
.planmain{min-width:0}
.idea{position:relative;padding:1.375rem 1.375rem 1.25rem;border-radius:1.625rem;margin-bottom:1rem;overflow:hidden;background:var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%)}
.ideas .idea{margin-bottom:0}
.idea::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g4))}
.idea.done{opacity:.6}
.ideahd{font-weight:700;font-size:.6875rem;text-transform:uppercase;letter-spacing:.1em;margin:0;background:linear-gradient(90deg,var(--g1),var(--g4));-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.ideatitle{font-family:var(--display);font-weight:800;font-size:1.4375rem;line-height:1.15;letter-spacing:-.03em;margin:.375rem 0 .5rem;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:.375rem .625rem;align-items:center;font-size:.8125rem;color:var(--muted)}
.tag{font-weight:700;font-size:.6875rem;padding:.15rem .55rem;border-radius:999px;color:var(--canal);background:color-mix(in srgb,var(--canal) 14%,transparent)}
.stops{list-style:none;margin:1rem 0 0;padding:0}
.stops li{position:relative;padding:0 0 1rem 1.5rem;display:grid;grid-template-columns:3.125rem 1fr;gap:.5rem}
.stops li::after{content:"";position:absolute;left:.3125rem;top:1.05rem;bottom:.15rem;width:2px;border-radius:1px;background:linear-gradient(var(--g1),var(--g4));opacity:.35}
.stops li:last-child{padding-bottom:0}
.stops li:last-child::after{display:none}
.stops li::before{content:"";position:absolute;left:0;top:.3rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--g1)}
.stops li:first-child::before{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 0 0 4px color-mix(in srgb,var(--g1) 20%,transparent)}
.stops .tm{font:600 .8125rem var(--mono);color:var(--muted);padding-top:.0625rem;font-variant-numeric:tabular-nums}
.stops .st{font-weight:700;letter-spacing:-.01em;line-height:1.35}
.stops .st a{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--g1) 55%,transparent);text-decoration-thickness:2px;text-underline-offset:3px}
.stops .nt{font-size:.8125rem;line-height:1.45;color:var(--muted);margin-top:.125rem}
.why{margin:1.125rem 0 0;font-size:.875rem;line-height:1.45;border-radius:1rem;padding:.75rem .875rem;background:var(--fill)}
.why b{font-weight:700}
.ideabtns{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:1rem}
.ideabtns .btn{font-size:.8125rem;padding:.45rem .8rem;min-height:2.125rem}
.cta{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}

/* ---- Toast ---- */
.toast{position:fixed;left:50%;bottom:max(1.25rem,env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,1.25rem) scale(.94);background:var(--toast);color:var(--toast-fg);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);font-weight:600;font-size:.875rem;padding:.7rem 1.125rem;border-radius:999px;
  box-shadow:0 12px 32px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .45s var(--spring);max-width:calc(100vw - 2rem);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}

footer{max-width:70rem;margin:0 auto;padding:1.5rem 1rem 2.5rem;font-size:.8125rem;line-height:1.55;color:var(--muted)}
footer a{color:inherit;text-underline-offset:2px}

/* ---- Responsive ---- */
@media (max-width:56rem){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"hello hello" "wx hl" "ton cls" "plan plan" "sav sav";grid-auto-rows:minmax(9.5rem,auto)}
  .t-hello{min-height:17rem;padding:1.5rem}
  .planwrap{grid-template-columns:1fr}
  .planside{position:static}
}
@media (max-width:30rem){
  .brand span{font-size:1.0625rem}
  .search{max-width:none}
  .navbtn{padding:.5rem .8rem}
  .rail{grid-auto-columns:80%}
  .hellokeys{width:3.25rem;height:3.25rem;right:1.125rem;top:1.125rem}
  .t-plan{padding:1.125rem}
  .plantitle{font-size:1.25rem}
  .heart{width:3rem;height:3rem}
  .bento{grid-auto-rows:auto}
  .bento>.tile{min-height:10rem}
  .bento>.t-hello{min-height:17rem}
  .bento>.t-plan{min-height:0}
  .bento>.t-sav{flex-direction:row;align-items:center;gap:1rem;min-height:0;padding-block:1rem}
  .hlglyph{font-size:4.25rem;bottom:-.875rem;right:-.625rem}
  .t-sav .big{margin:0;font-size:2.25rem}
  .idea{padding:1.125rem 1.125rem 1rem}
  .stops li{grid-template-columns:2.75rem 1fr}
}

/* ---- Preferences ---- */
@media (prefers-reduced-motion:reduce){
  .glow i{animation:none!important}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (prefers-reduced-transparency:reduce){
  .tile,.planner,.idea,.wx,.empty,.nav,.search input,.pillbtn,.arrow,.top::before{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  .t-hl{background:linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 45%,#120818))}
  .glow{opacity:.35}
}
@media (prefers-contrast:more){
  :root{--line:color-mix(in srgb,var(--fg) 30%,transparent);--line-strong:color-mix(in srgb,var(--fg) 45%,transparent);--glass-edge:var(--line-strong)}
  .glow{display:none}
}

/* ---- Added: theme toggle, photos, detail sheet, shared list ---- */
:root{--raised:#ffffff;--scrim:rgba(20,14,24,.4);--sheet-ease:cubic-bezier(.32,.72,0,1)}
:root[data-theme="dark"]{--raised:#1b1922;--scrim:rgba(0,0,0,.58)}
.themebtn{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--glass-strong);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .12s ease-out}
.themebtn:active{transform:scale(.92)}
.themebtn svg{width:1.15rem;height:1.15rem}
/* Photo covers */
.cover .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--settle)}
.cover.has-img::before{z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 38%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5))}
.cover.has-img .glyph{display:none}
.cover .dbadge,.cover .flags{z-index:2}
@media (hover:hover){.card:hover .cover .photo{transform:scale(1.05)}}
.ctitle .open{all:unset;cursor:pointer;text-wrap:pretty}
.ctitle .open::before{content:"";position:absolute;inset:0;z-index:1}
.card:has(.open:focus-visible){outline:2px solid var(--g4);outline-offset:3px}
.t-hl .hlphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t-hl.has-img::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.05) 35%,rgba(0,0,0,.7))}
.t-hl.has-img .hlglyph{display:none}
.t-hl .lbl,.t-hl .hltitle,.t-hl .hlsub{position:relative;z-index:1}
/* Shared-list banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin:.75rem 0 0;padding:.875rem 1.125rem;border-radius:1.25rem;background:var(--glass-strong);border:.5px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.banner p{margin:0;flex:1 1 14rem}
.btn.wa{background:#1fa855;color:#fff}
@media (hover:hover){.btn.wa:hover{background:#178c46}}
.vhead-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem}
/* Detail sheet: bottom sheet on phones, side panel on wide screens */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;transition:opacity .35s ease;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--raised);border-radius:1.75rem 1.75rem 0 0;box-shadow:var(--shadow-hi);
  transform:translateY(105%);transition:transform .5s var(--sheet-ease);will-change:transform}
.sheet.on{transform:none}
.sheet.dragging{transition:none}
.grab{flex:none;display:grid;place-items:center;height:1.5rem;cursor:grab;touch-action:none}
.grab::before{content:"";width:2.5rem;height:.3rem;border-radius:999px;background:var(--line-strong)}
.sheet .close{position:absolute;top:.75rem;right:.75rem;z-index:2;width:2.375rem;height:2.375rem;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;color:#fff;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sheet .close svg{width:1.1rem;height:1.1rem}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:0 1.25rem calc(1.5rem + env(safe-area-inset-bottom))}
.shero{position:relative;aspect-ratio:16/10;border-radius:1.125rem;overflow:hidden;background:linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 45%,#140a1c))}
.shero img{width:100%;height:100%;object-fit:cover;display:block}
.shero .glyph{font-size:6rem;right:.5rem;bottom:-1rem}
.scat{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:1rem}
.spill{display:inline-flex;align-items:center;font-weight:700;font-size:.75rem;padding:.2rem .6rem;border-radius:999px;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.spill.hot{--cc:var(--red)}
.stitle{font-family:var(--display);font-weight:800;font-size:1.625rem;line-height:1.1;letter-spacing:-.03em;margin:.5rem 0 0;text-wrap:balance}
.facts{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.625rem}
.facts li{display:grid;grid-template-columns:1.25rem 1fr;gap:.75rem;align-items:start;font-size:.9375rem}
.facts svg{width:1.25rem;height:1.25rem;color:var(--muted);margin-top:.125rem}

.sdesc{margin:1rem 0 0;font-size:.9688rem;line-height:1.55}

.rowbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.rowbtns .btn{flex-direction:column;gap:.25rem;justify-content:center;min-height:3.75rem;border-radius:1.125rem;font-size:.75rem}
.rowbtns .btn svg{width:1.15rem;height:1.15rem}

  .sbody{padding-top:1.25rem}
}

.catpill{background:rgba(0,0,0,.35)}
.glow{contain:strict}
.glow i{filter:none;opacity:calc(var(--glow-o) * .9)}
.motion .grad{animation:none}
.motion .t-plan::before{animation:none}
.planglow{display:none}
.rail{-webkit-mask-image:none;mask-image:none}
.sec{content-visibility:auto;contain-intrinsic-size:auto 27rem}

const DAY = 864e5;
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"], MON=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const add = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const today = new Date(); today.setHours(0,0,0,0);
const TODAY = iso(today);
const daysBetween = (a,b) => Math.round((pd(b)-pd(a))/DAY);
const nice = s => { const d=pd(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const shortNice = s => { const d=pd(s); return `${DAYS[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };

// Time windows relative to today, so the page stays right after it's uploaded.
const dow = today.getDay();
let wkStart, wkEnd;
if (dow===6 || dow===0 || dow===5) { wkStart = today; wkEnd = add(today, (7-dow)%7); }
else { wkStart = add(today, 6-dow); wkEnd = add(wkStart, 1); }
let wnStart = (dow>=1 && dow<=4) ? today : add(today, ((8-dow)%7)||7);
const wnEnd = add(wnStart, 4-wnStart.getDay());
const W = {
  weekend:[iso(wkStart), iso(wkEnd)],
  next:[iso(wnStart), iso(wnEnd)],
  soon:[iso(add(wkEnd > wnEnd ? wkEnd : wnEnd, 1)), iso(add(today, 60))],
};

const isEvergreen = x => !x.s && !x.e;
const isExpo = x => x.cat==="Exhibition";
function occurs(x, day){ // does event x happen on YYYY-MM-DD day?
  if (isEvergreen(x)) return true;
  if (x.dates) return x.dates.includes(day);
  if (x.weekly!==undefined) return day>=x.s && pd(day).getDay()===x.weekly;
  return (!x.s || x.s<=day) && (!x.e || day<=x.e);
}
function datesIn(x, [a,b]){ const out=[]; for (let d=pd(a); iso(d)<=b; d=add(d,1)) if (occurs(x, iso(d))) out.push(iso(d)); return out; }
const ended = x => x.e && x.e < TODAY && x.weekly===undefined;
// A continuous run (festival, multi-day event), as opposed to one day or scattered dates.
const isRun = x => x.weekly===undefined && !x.dates && x.s && x.e && x.s!==x.e;
const nextDate = x => x.dates ? (x.dates.find(d=>d>=TODAY) || x.dates.at(-1)) : x.weekly!==undefined ? (datesIn(x,[TODAY,iso(add(today,7))])[0] || x.s) : x.s;
const HL = () => E.find(x=>x.hl && !ended(x));

/* ---------- storage ---------- */
const load = (k,f) => { try { const v=JSON.parse(localStorage.getItem(k)); return v ?? f; } catch(_) { return f; } };
const store = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} };
let saved = new Set(load("uil-saved", []));
let ideas = load("uil-ideas", []); // saved/done date ideas
const persist = () => { store("uil-saved",[...saved]); store("uil-ideas",ideas); };

// Category colour and cover glyph.
const CAT_STYLE = {Film:["#a855f7",`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M17 9.5h4M3 14.5h4M17 14.5h4"/></svg>`],Music:["#ec4899",`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>`],Comedy:["#f59e0b",`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>`],Talks:["#0ea5e9",`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9.5h8M8 12h5"/></svg>`],Theatre:["#e11d48",`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18M5 4v13c2.5-1 4-4 4-8M19 4v13c-2.5-1-4-4-4-8M3 20h18"/></svg>`],Culture:["#14b8a6",`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/></svg>`],Exhibition:["#6366f1",`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 16l5-5 4 4 2-2 5 5"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>`],Outdoors:["#22c55e",`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-5M6.5 16L12 4l5.5 12z"/></svg>`]};
// How good something is for a night out together: shows and highlights up, workshops and courses down.
const MINOR = /workshop|cursus|training|masterclass|spreekuur|inloop|ruil|repair|vergadering|bijeenkomst|kinder|kids|peuter|senior|bingo|open zang|oefen|\bles\b|lessen|yoga|meditatie|instap|rondleiding|excursie|ideecafe|sjabloon|textiel/;
function score(x){
  let s = {Comedy:4, Music:3, Theatre:3, Film:3, Talks:2, Outdoors:2, Exhibition:2, Culture:1}[x.cat] ?? 1;
  if (x.hl) s += 6;
  if (x.img) s += 1;
  if (x.d && !x.auto) s += 1;
  const t = firstTime(x.time); if (t && t >= "18:00") s += 1.5;
  if (MINOR.test(x.t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""))) s -= 4;
  return s;
}

function introFor(k){
  const r = (a,b) => a===b ? nice(a) : `${nice(a)} to ${nice(b)}`;
  return {
    weekend: r(...W.weekend) + "." + (HL() && datesIn(HL(), W.weekend).length ? ` ${HL().t} is the big one this week.` : ""),
    next: r(...W.next) + ". Good for a midweek concert or comedy night after work.",
    soon: "The next two months, in Leiden and nearby.",
    expo: "Sorted by closing date, so the ones about to close come first.",
    always: "No date needed. For when nothing on the agenda clicks.",
    plan: "Pick a day and a mood. You get three plans built from what's on that day, checked against the forecast.",
  }[k];
}

let tab = "home", cat = "All", query = "", lastSection = "weekend";
let openId = null, openDay = null, pendingImport = [], limit = 36;
try { const h = location.hash.slice(1); if (VIEWS.includes(h)) tab = h; } catch(_){}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const motionOK = matchMedia("(prefers-reduced-motion: no-preference)").matches;
if (motionOK) document.documentElement.classList.add("motion");

function itemsFor(k){
  const live = E.filter(x=>!ended(x));
  let list;
  if (k==="saved") list = live.filter(x=>saved.has(x.id));
  else if (k==="expo") list = live.filter(isExpo).sort((a,b)=>a.e.localeCompare(b.e));
  else if (k==="always") list = live.filter(isEvergreen);
  else if (k==="soon") list = live.filter(x=>!isExpo(x) && !isEvergreen(x) && x.weekly===undefined && datesIn(x,W.soon).length && !datesIn(x,W.weekend).length && !datesIn(x,W.next).length)
                        .sort((a,b)=>datesIn(a,W.soon)[0].localeCompare(datesIn(b,W.soon)[0]));
  else if (W[k]) list = live.filter(x=>!isExpo(x) && !isEvergreen(x) && datesIn(x,W[k]).length)
                        .sort((a,b)=>(isRun(a) ? "0" : datesIn(a,W[k])[0]).localeCompare(isRun(b) ? "0" : datesIn(b,W[k])[0]));
  else list = [];
  return list;
}

function searchItems(q){
  const f = fold(q);
  return E.filter(x=>!ended(x) && fold([x.t,x.d,x.where,x.town,x.cat].join(" ")).includes(f))
          .sort((a,b)=>(isEvergreen(a)?"9":(a.s||a.e)).localeCompare(isEvergreen(b)?"9":(b.s||b.e)));
}

/* Nav with a sliding pill */
const navKey = () => query ? "" : SECTIONS.some(s=>s.k===tab) ? "agenda" : tab;
function renderNav(){
  const nk = navKey(), n = itemsFor("saved").length + ideas.length;
  $("navbtns").innerHTML = NAV.map(t=>`<button class="navbtn${t.k==="plan"?" plan":""}" role="tab" type="button" aria-selected="${t.k===nk}" data-go="${t.k}">${t.k==="plan"?`<span class="nheart">${HEART}</span>`:""}${t.l}${t.k==="saved"&&n?`<span class="count">${n}</span>`:""}</button>`).join("");

}
function movePill(){
  const pill = $("navpill"), sel = $("navbtns").querySelector('[aria-selected="true"]');
  $("tabs").dataset.k = sel ? sel.dataset.go : "";
  if (!sel) { pill.style.opacity = 0; return; }
  pill.style.opacity = 1; pill.style.width = sel.offsetWidth+"px"; pill.style.transform = `translateX(${sel.offsetLeft}px)`;
}

/* Event card */
function dateBits(x, on){
  const f = d => [DOW[d.getDay()], String(d.getDate()), MON[d.getMonth()]];
  if (isEvergreen(x)) return ["any","day",""];
  if (on) return f(pd(on));
  if (!x.s || (isExpo(x) && x.s!==x.e)) { const [,n,m] = f(pd(x.e)); return ["until",n,m]; }
  if (x.dates || x.weekly!==undefined) return f(pd(nextDate(x)));
  if (x.s!==x.e) { const s=pd(x.s), e=pd(x.e); return ["from", `${s.getDate()}–${e.getDate()}`, s.getMonth()===e.getMonth() ? MON[e.getMonth()] : `${MON[s.getMonth()]}–${MON[e.getMonth()]}`]; }
  return f(pd(x.s));
}
function card(x, on, d = 0){
  const [cc, glyph] = CAT_STYLE[x.cat];
  const [top, big, bot] = dateBits(x, on);
  const flags = [];
  if (isExpo(x)) { const dl = daysBetween(TODAY, x.e); if (dl<=21) flags.push(`<span class="flag">${dl===0?"Last day":dl+" days left"}</span>`); }
  if (x.isNew) flags.push(`<span class="flag new">New</span>`);
  if (x.hl) flags.push(`<span class="flag new">Highlight</span>`);
  const more = x.dates ? x.dates.filter(d=>d>=TODAY && d!==(on||nextDate(x))).length : 0;
  const when = [x.time, x.weekly!==undefined ? "every "+DAYS[x.weekly] : "", more ? `+${more} more date${more===1?"":"s"}` : ""].filter(Boolean).join(" · ");
  const place = x.where + (x.town!=="Leiden" && !x.where.includes(x.town) ? ", "+x.town : "");
  const isS = saved.has(x.id);
  return `<article class="card rv" style="--cc:${cc};--d:${d}" data-tilt>
    <div class="cover${x.img?" has-img":""}">${x.img ? imgTag(x.img, "photo", 560, 240) : ""}<span class="glyph" aria-hidden="true">${glyph}</span>
      <div class="dbadge"><span>${top}</span><b>${big}</b><span>${bot}</span></div>
      <div class="flags"><span class="catpill">${x.cat}</span>${flags.join("")}</div></div>
    <div class="cbody">
      <h3 class="ctitle"><button class="open" type="button" data-open="${x.id}" data-day="${on||""}">${esc(x.t)}</button></h3>
      <p class="cmeta">${esc(place)}${when?" · "+esc(when):""}</p>
      ${x.d && !x.auto ? `<p class="cdesc">${esc(x.d)}</p>` : ""}
      <div class="cacts">
        ${isEvergreen(x) ? "" : `<button class="iconbtn" type="button" title="Add to calendar" aria-label="Add to calendar: ${esc(x.t)}" data-cal="${x.id}"${on?` data-on="${on}"`:""}>${CAL_SVG}</button>`}
        <button class="iconbtn star" type="button" aria-pressed="${isS}" aria-label="${isS?"Remove from saved":"Save"}: ${esc(x.t)}" data-id="${x.id}">${isS?STAR_ON:STAR}</button>
      </div>
    </div>
  </article>`;
}
const vhead = (title, sub, d = 0) => `<div class="vhead rv" style="--d:${d}"><h1 class="vtitle">${title}</h1>${sub?`<p class="vsub">${sub}</p>`:""}</div>`;

/* Home */
let wxFresh = false;
function wxTile(){
  const w = wxFor(TODAY);
  if (!w.known) return `<div class="tile t-wx rv" style="--d:2"><span class="lbl">Leiden today</span><div class="wxload">${wxState==="error" ? "Forecast unavailable right now." : "Loading the forecast…"}</div></div>`;
  const [ic, desc] = WXC(w.code);
  const next = [1,2,3].map(n=>iso(add(today,n))).filter(d=>WX[d]).map(d=>`<li><span>${DAYS[pd(d).getDay()].slice(0,3)}</span><i aria-hidden="true">${WXC(WX[d].code)[0]}</i><b>${Math.round(WX[d].tmax)}°</b></li>`).join("");
  return `<div class="tile t-wx rv${wxFresh?" fresh":""}" style="--d:2"><span class="lbl">Leiden today</span>
    <div class="wxnow"><span class="wxbig">${Math.round(w.tmax)}°</span><span class="wxico" aria-hidden="true">${ic}</span></div>
    <p class="wxdesc">${cap(desc)} · ${w.pp}% chance${/rain|drizzle|shower|thunder/.test(desc) ? "" : " of rain"}</p><ul class="wxnext" aria-label="Next days">${next}</ul></div>`;
}
const rail = (k, title, sub, all, dated, rank = true) => { const skip = HL()?.id;
  const list = all.filter(x=>x.id!==skip), top = (rank ? [...list].sort((a,b)=>b._s-a._s) : list).slice(0,10);
  return !list.length ? "" : `<section class="sec sr">
    <div class="sechd"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:""}</div>
      <div class="sechd-r"><button class="arrow" type="button" data-scroll="-1" aria-label="Scroll ${title} back">${LEFT}</button><button class="arrow" type="button" data-scroll="1" aria-label="Scroll ${title} forward">${RIGHT}</button>
      <a class="link" href="#${k}" data-go="${k}">See all <span class="count">${list.length}</span></a></div></div>
    <div class="rail">${top.map(x=>card(x, dated && !isRun(x) ? datesIn(x,W[k])[0] : undefined)).join("")}</div></section>`; };

function renderHome(){
  const wk = itemsFor("weekend"), nx = itemsFor("next"), soon = itemsFor("soon"), expo = itemsFor("expo"), always = itemsFor("always");
  const h = new Date().getHours(), greet = h<5 ? "Still up?" : h<12 ? "Good morning" : h<18 ? "Good afternoon" : "Good evening";
  const range = W.weekend[0]===W.weekend[1] ? nice(W.weekend[0]) : `${shortNice(W.weekend[0])} – ${shortNice(W.weekend[1])}`;
  const n = wk.length;
  const hlOn = HL() && datesIn(HL(), W.weekend).length ? HL() : null;

  const todays = E.filter(x=>!ended(x) && !isExpo(x) && !isEvergreen(x) && occurs(x,TODAY));
  const tomorrow = iso(add(today,1));
  const tSet = todays.length ? ["Today", todays, TODAY] : ["Tomorrow", E.filter(x=>!ended(x) && !isExpo(x) && !isEvergreen(x) && occurs(x,tomorrow)), tomorrow];
  const tKey = tSet[2] >= W.weekend[0] && tSet[2] <= W.weekend[1] ? "weekend" : "next";
  const hl = E.find(x=>x.hl && !ended(x)) || wk[0];

  html += `<div class="bento${savedN ? "" : " nosav"}">

      <span class="hellokeys">${KEYS}</span>
      <span class="hellosub">${greet} 👋</span>
      <h1 class="hello">There ${n===1?"is":"are"} <span class="grad"><span data-count="${n}">${n}</span> things</span> on in Leiden this weekend.</h1>

    </section>
    <div class="stats">${wxTile()}`;
  if (hl) { const [cc, g] = CAT_STYLE[hl.cat]; const dl = hl.e ? daysBetween(TODAY, hl.e) : 0;
    html += `<a class="tile t-hl rv${hl.img?" has-img":""}" style="--d:3;--cc:${cc}" href="#e/${hl.id}" data-open="${hl.id}" data-tilt>${hl.img ? imgTag(hl.img, "hlphoto", 640, 640, false) : ""}<span class="lbl">Highlight</span><span class="hlglyph" aria-hidden="true">${g}</span>
      <b class="hltitle">${esc(hl.t)}</b>${hl.s!==hl.e && hl.e ? `<span class="hlsub">Until ${shortNice(hl.e)}</span><span class="hlsub hlleft">${dl===0 ? "Last day" : `${dl} day${dl===1?"":"s"} left`}</span>` : `<span class="hlsub">${shortNice(hl.s)}</span>`}</a>`; }
  html += `<a class="tile t-ton rv" style="--d:4" href="#${tKey}" data-go="${tKey}" data-tilt><span class="lbl">${tSet[0]}</span>
      <span class="big" data-count="${tSet[1].length}">${tSet[1].length}</span><span class="tsub">thing${tSet[1].length===1?"":"s"} on</span>
      <ul class="mini">${tSet[1].slice(0,2).map(x=>`<li><i style="--cc:${CAT_STYLE[x.cat][0]}"></i>${esc(x.t)}</li>`).join("")}</ul></a>`;
  if (closing) { const dl = daysBetween(TODAY, closing.e), C = +(2*Math.PI*22).toFixed(2), frac = Math.max(.05, Math.min(dl,30)/30);
    html += `<a class="tile t-cls rv" style="--d:5" href="#expo" data-go="expo" data-tilt><span class="lbl">Closing soon</span>

function revealOnScroll(animate){
